        if (l === 1) { st.rings = [it.clues[0]]; }
        if (l === 2) { st.rings = it.clues.slice(0, 2); }
        if (l === 3) { st.dim = possible([it.clues[0]]); }
        if (l === 4) { const p = G.digPossible(it, allClues()); st.dim = p && p.size ? p : possible(allClues()); }
        if (l === 5) { st.hot = new Set(it.bones.map(b => k(b.x, b.y))); }
        draw();
      },
      autoSolve() { it.bones.forEach(b => { if (!st.found.has(k(b.x, b.y))) tap(b.x, b.y); }); }
    };
  }

  /* ======================================================================
   * Σκελετός
   * ====================================================================== */
  function bonesCtrl(m, board, ctl) {
    const it = m.item;
    const st = { orient: {}, placed: {}, sel: null, invalid: 0, tint: it.outlines, hot: null };
    it.pieces.forEach(p => { st.orient[p.id] = { rot: p.rot, flip: p.flip }; });
    const maskSet = new Set(it.mask.map(c => c[0] + ',' + c[1]));
    const shapeOf = id => { const p = it.pieces.find(q => q.id === id); const o = st.orient[id]; return G.orient(p.shape, o.rot, o.flip); };
    const occupied = except => { const s = new Set(); for (const id in st.placed) if (+id !== except) st.placed[id].forEach(c => s.add(c[0] + ',' + c[1])); return s; };
    const owner = {}; it.pieces.forEach(p => p.cells.forEach(c => { owner[c[0] + ',' + c[1]] = p.id; }));
    const TINTS = ['#ffe3a3', '#c9f0ff', '#ffd0e4', '#d7f7c6', '#e4d7ff', '#ffe0c7', '#c7fff1', '#f9ffc7', '#ffd6d6', '#dfe7ff'];
    board.innerHTML = `<div class="bboard" id="bb"><div class="ghostdino">${A.dinoGhost(it.species)}</div><div class="grid" id="bg" style="background:transparent;border:0;padding:0"></div></div>`;
    ctl.insertAdjacentHTML('afterbegin', `<div class="panel"><div class="lbl">Κόκαλα</div><div class="tray" id="tray"></div><div class="row" style="margin-top:8px"><button class="btn" id="rot">${I.rotate}<span>Γύρνα</span></button>${it.flip ? `<button class="btn" id="flp">${I.flip}<span>Καθρέφτης</span></button>` : ''}</div></div>`);
    const grid = $('#bg');
    let cellPx = 30;
    function fit() {
      const p = $('#bb').parentElement; const w = p.clientWidth - 8, h = narrow() ? Infinity : p.clientHeight - 8;
      cellPx = Math.max(16, Math.min(w / it.w, h / it.h, 70));
      $('#bb').style.width = cellPx * it.w + 'px'; grid.style.width = cellPx * it.w + 'px';
      grid.style.gridTemplateColumns = `repeat(${it.w},1fr)`; grid.style.gap = '0';
      drawTray();
    }
    function draw() {
      const occ = {}; for (const id in st.placed) st.placed[id].forEach(c => { occ[c[0] + ',' + c[1]] = +id; });
      let h = '';
      for (let y = 0; y < it.h; y++) for (let x = 0; x < it.w; x++) {
        const kk = x + ',' + y, inMask = maskSet.has(kk);
        let style = 'aspect-ratio:1;border-radius:3px;';
        if (!inMask) style += 'background:transparent;';
        else if (occ[kk] != null) style += `background:${A.BONE};outline:2px solid ${K};outline-offset:-2px;`;
        else style += `background:${st.tint ? TINTS[owner[kk] % TINTS.length] : 'rgba(255,248,234,.75)'};outline:1px dashed rgba(29,21,48,.35);outline-offset:-1px;`;
        if (st.hot && st.hot.has(kk) && occ[kk] == null) style += 'box-shadow:inset 0 0 0 3px #ffd21f;';
        h += `<div class="bc" data-x="${x}" data-y="${y}" ${occ[kk] != null ? `data-p="${occ[kk]}"` : ''} style="${style}"></div>`;
      }
      grid.innerHTML = h;
      grid.querySelectorAll('.bc').forEach(c => c.onclick = () => tapCell(+c.dataset.x, +c.dataset.y, c.dataset.p));
    }
    function pieceHTML(id) {
      const sh = shapeOf(id), w = Math.max(...sh.map(c => c[0])) + 1, h = Math.max(...sh.map(c => c[1])) + 1, set = new Set(sh.map(c => c[0] + ',' + c[1]));
      let cells = ''; for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) cells += `<i class="${set.has(x + ',' + y) ? '' : 'e'}"></i>`;
      const u = Math.max(14, Math.min(cellPx * 0.8, 30));
      return `<div class="piece ${st.sel === id ? 'sel' : ''}" data-id="${id}" style="grid-template-columns:repeat(${w},${u}px);--u:${u}px">${cells}</div>`;
    }
    function drawTray() {
      const left = it.pieces.filter(p => !st.placed[p.id]).map(p => p.id);
      $('#tray').innerHTML = left.map(pieceHTML).join('') || '<span class="small">Όλα στη θέση τους!</span>';
      $$('#tray .piece').forEach(el => el.addEventListener('pointerdown', e => startDrag(e, +el.dataset.id, el)));
    }
    function handleOf(sh) {
      const cx = sh.reduce((a, c) => a + c[0], 0) / sh.length, cy = sh.reduce((a, c) => a + c[1], 0) / sh.length;
      return sh.reduce((b, c) => (Math.hypot(c[0] - cx, c[1] - cy) < Math.hypot(b[0] - cx, b[1] - cy) ? c : b), sh[0]);
    }
    function tryPlace(id, tx, ty) {
      const sh = shapeOf(id), hd = handleOf(sh), occ = occupied(id);
      for (const [dx, dy] of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const cells = G.bonesPlace(it, sh, tx - hd[0] + dx, ty - hd[1] + dy, occ);
        if (cells) { st.placed[id] = cells; st.sel = null; App.sfx.tap(); draw(); drawTray(); check(); return true; }
      }
      st.invalid++; m.attempts = 1 + Math.floor(st.invalid / 4);
      App.sfx.no(); App.shake('#bb');
      if (st.invalid % 3 === 0) say(m, 'Δεν χωράει εκεί. Μήπως θέλει γύρισμα;');
      return false;
    }
    function tapCell(x, y, pid) {
      if (m.done) return;
      if (pid != null && st.sel == null) { delete st.placed[+pid]; draw(); drawTray(); return; }
      if (st.sel == null) { say(m, 'Διάλεξε πρώτα ένα κόκαλο από κάτω.'); return; }
      tryPlace(st.sel, x, y);
    }
    let drag = null;
    function startDrag(e, id, el) {
      e.preventDefault();
      drag = { id, x0: e.clientX, y0: e.clientY, moved: false, ghost: null };
      const move = ev => {
        if (!drag) return;
        if (!drag.moved && Math.hypot(ev.clientX - drag.x0, ev.clientY - drag.y0) > 8) {
          drag.moved = true; st.sel = id;
          const g = document.createElement('div'); g.className = 'drag'; g.innerHTML = pieceHTML(id).replace(/--u:[\d.]+px/, `--u:${cellPx}px`).replace(/repeat\((\d+),[\d.]+px\)/, `repeat($1,${cellPx}px)`);
          document.body.appendChild(g); drag.ghost = g;
        }
        if (drag.ghost) {
          const sh = shapeOf(id), hd = handleOf(sh);
          drag.ghost.style.left = (ev.clientX - (hd[0] + 0.5) * (cellPx + 2) - 4) + 'px';
          drag.ghost.style.top = (ev.clientY - (hd[1] + 0.5) * (cellPx + 2) - 4) + 'px';
        }
      };
      const up = ev => {
        window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
        const d0 = drag; drag = null;
        if (d0 && d0.ghost) {
          d0.ghost.remove();
          const under = document.elementFromPoint(ev.clientX, ev.clientY);
          const cell = under && under.closest && under.closest('.bc');
          if (cell) tryPlace(id, +cell.dataset.x, +cell.dataset.y); else { drawTray(); }
        } else { st.sel = st.sel === id ? null : id; drawTray(); }
      };
      window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
    }
    function check() {
      if (Object.keys(st.placed).length === it.pieces.length) {
        App.sfx.ok();
        say(m, m.origin.type === 'fossil' ? 'Ο σκελετός είναι έτοιμος! Ανάβω το ρεύμα…' : 'Τέλειος σκελετός!');
        $('#bb .ghostdino').style.opacity = '.9';
        setTimeout(() => finish(m, true), 900);
      }
    }
    $('#rot').onclick = () => { if (st.sel == null) { say(m, 'Διάλεξε πρώτα ένα κόκαλο.'); return; } st.orient[st.sel].rot = (st.orient[st.sel].rot + 1) % 4; App.sfx.tap(); drawTray(); };
    if ($('#flp')) $('#flp').onclick = () => { if (st.sel == null) return; st.orient[st.sel].flip = !st.orient[st.sel].flip; App.sfx.tap(); drawTray(); };
    const placeHome = p => {
      const cells = p.cells.map(c => c.slice());
      for (const id in st.placed) if (st.placed[id].some(c => cells.some(q => q[0] === c[0] && q[1] === c[1]))) delete st.placed[id];
      st.placed[p.id] = cells; st.orient[p.id] = { rot: 0, flip: false };
    };
    fit(); draw();
    say(m, (m.origin.type === 'fossil' ? `Το απολίθωμα του ${C.SPECIES[it.species].name}! ` : '') + C.FAMS.bones.say + ' Σύρε ένα κόκαλο ή πάτησέ το και μετά πάτα στον σκελετό.');
    return {
      fit: () => { fit(); draw(); },
      hint(l) {
        const left = it.pieces.filter(p => !st.placed[p.id]);
        if (l === 1 && left.length) { st.sel = left.reduce((a, b) => b.cells.length > a.cells.length ? b : a).id; drawTray(); }
        if (l === 2) { st.hot = new Set(it.mask.filter(([x, y]) => [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(([dx, dy]) => maskSet.has((x + dx) + ',' + (y + dy))).length <= 1).map(c => c[0] + ',' + c[1])); draw(); }
        if (l === 3) { st.tint = true; draw(); }
        if (l === 4 && left.length) { placeHome(left[0]); draw(); drawTray(); check(); }
        if (l === 5) { it.pieces.forEach(p => { if (!st.placed[p.id] || true) placeHome(p); }); draw(); drawTray(); check(); }
      },
      autoSolve() { st.placed = {}; it.pieces.forEach(placeHome); draw(); drawTray(); check(); },
      destroy() { if (drag && drag.ghost) drag.ghost.remove(); }
    };
  }

  /* ======================================================================
   * Πρόγραμμα (build · predict · debug)
   * ====================================================================== */
  function codeCtrl(m, board, ctl) {
    const it = m.item, v = it.variant || 'build';
    const sp = App.ST.active || 'trex';
    const st = { prog: v === 'build' ? [] : it.shown.map(b => Object.assign({}, b)), sel: -1, running: false, got: new Set(), dots: null, nums: false, pickCell: null, phase: v === 'debug' ? 'find' : 'edit', okMarks: new Set(), badMark: -1, timer: 0 };
    const k = (x, y) => x + ',' + y;
    board.innerHTML = `<div class="grid" id="cg"></div>`;
    const DN = { U: 'πάνω', D: 'κάτω', L: 'αριστερά', R: 'δεξιά' };
    let ctlHTML = '';
    if (v === 'predict') ctlHTML = `<div class="panel"><div class="lbl">Το πρόγραμμα</div><div class="prog" id="prog"></div><div class="row" style="margin-top:8px"><button class="btn go" id="run" disabled>${I.eye}<span>Δες!</span></button></div></div>`;
    else ctlHTML = `<div class="panel"><div class="lbl">Πρόγραμμα <span id="cnt"></span></div><div class="prog" id="prog"></div>
      <div class="row" id="edit" style="margin-top:8px"></div></div>
      <div class="panel"><div class="lbl">Κουτάκια</div><div class="palette" id="pal">${['U', 'R', 'D', 'L'].map(d => `<button class="blk" data-d="${d}" aria-label="${DN[d]}">${A.ARROW(d)}</button>`).join('')}${it.jump ? ['U', 'R', 'D', 'L'].map(d => `<button class="blk jp" data-j="${d}" aria-label="άλμα ${DN[d]}">${A.ARROW(d)}<span class="hop">${I.jump}</span></button>`).join('') : ''}</div>
      <div class="row" style="margin-top:10px"><button class="btn go" id="run">${I.play}<span>ΠΑΜΕ</span></button><button class="btn sm" id="clr">${I.trash}</button></div></div>`;
    ctl.insertAdjacentHTML('afterbegin', ctlHTML);
    const grid = $('#cg');
    function drawBoard(pos, extra) {
      let h = '';
      const pathSet = new Set((st.dots || []).map(p => k(p.x, p.y)));
      for (let y = 0; y < it.h; y++) for (let x = 0; x < it.w; x++) {
        const t = it.grid[y][x];
        const ti = it.targets.findIndex(q => q.x === x && q.y === y);
        let cls = 'cellb t-' + (t === '.' ? 'g' : t);
        if (pathSet.has(k(x, y)) && t === '.') cls += ' t-dot';
        if (st.pickCell && st.pickCell.x === x && st.pickCell.y === y) cls += ' t-pick';
        if (extra && extra.end && extra.end.x === x && extra.end.y === y) cls += ' t-end';
        let inner = '';
        if (t === 'R') inner = `<svg viewBox="0 0 20 20" width="70%"><path d="M3 16 L6 6 L12 3 L17 9 L17 16Z" fill="#6f6c8a" stroke="${K}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
        if (ti >= 0) inner = GEM.replace('class="gem"', `class="gem ${st.got.has(ti) ? 'got' : ''}"`);
        if (st.nums && t === '.' && (x === it.start.x || y === it.start.y) && !(x === it.start.x && y === it.start.y)) inner += `<span style="position:absolute;left:4px;top:2px;font-size:.75em;color:#7a4a2a">${Math.abs(x - it.start.x) + Math.abs(y - it.start.y)}</span>`;
        h += `<div class="${cls}" data-x="${x}" data-y="${y}" style="${t === '.' ? 'background:#cdeaa0' : ''}">${inner}</div>`;
      }
      grid.innerHTML = h + `<div class="mover" id="mv"><div class="dhead">${A.dinoHead(sp, App.ST.dinos[sp] || { col: 0 })}</div></div>`;
      fitGrid(grid, it.w, it.h);
      placeMover(pos || it.start);
      if (v === 'predict') grid.querySelectorAll('.cellb').forEach(c => c.onclick = () => { if (st.running || m.done) return; st.pickCell = { x: +c.dataset.x, y: +c.dataset.y }; drawBoard(); $('#run').disabled = false; App.sfx.tap(); });
    }
    function placeMover(p) {
      const cell = grid.querySelector(`[data-x="${p.x}"][data-y="${p.y}"]`), mv = $('#mv');
      if (!cell || !mv) return;
      mv.style.left = cell.offsetLeft + 'px'; mv.style.top = cell.offsetTop + 'px'; mv.style.width = cell.offsetWidth + 'px'; mv.style.height = cell.offsetHeight + 'px';
    }
    function drawProg(runIdx) {
      const slots = v === 'build' ? it.budget : st.prog.length;
      let h = '';
      for (let i = 0; i < slots; i++) {
        const b = st.prog[i];
        if (!b) { h += `<div class="blk slot"></div>`; continue; }
        let cls = 'blk' + (b.t === 'jp' ? ' jp' : '') + (st.sel === i ? ' on' : '') + (runIdx === i ? ' run' : '') + (st.badMark === i ? ' badblk' : '') + (st.okMarks.has(i) ? ' ' : '');
        h += `<button class="${cls}" data-i="${i}" ${st.okMarks.has(i) ? 'style="background:#c9f5dd"' : ''}>${A.ARROW(b.d)}${b.t === 'jp' ? `<span class="hop">${I.jump}</span>` : ''}${b.t === 'mv' && (b.n || 1) > 1 ? `<span class="n">×${b.n}</span>` : ''}</button>`;
      }
      $('#prog').innerHTML = h;
      if ($('#cnt')) $('#cnt').textContent = `(${st.prog.length}/${slots})`;
      $$('#prog [data-i]').forEach(b => b.onclick = () => tapBlock(+b.dataset.i));
      drawEdit();
    }
    function drawEdit() {
      const e = $('#edit'); if (!e) return;
      const b = st.prog[st.sel];
      if (!b || v === 'predict') { e.innerHTML = it.counts && v === 'build' && !App.ST.tips.count ? '<span class="small">Πάτα ένα κουτάκι στο πρόγραμμα και μετά + για να κάνει πολλά βήματα!</span>' : ''; return; }
      e.innerHTML = (b.t === 'mv' && it.counts ? `<button class="btn sq" id="minus" aria-label="λιγότερα">${I.minus}</button><span class="chip">×${b.n || 1}</span><button class="btn sq" id="plus" aria-label="περισσότερα">${I.plus}</button>` : '') + `<button class="btn sq rd" id="del" aria-label="σβήσε">${I.trash}</button>`;
      if ($('#plus')) $('#plus').onclick = () => { b.n = Math.min(9, (b.n || 1) + 1); App.ST.tips.count = 1; App.sfx.tap(); drawProg(); };
      if ($('#minus')) $('#minus').onclick = () => { b.n = Math.max(1, (b.n || 1) - 1); App.sfx.tap(); drawProg(); };
      $('#del').onclick = () => { st.prog.splice(st.sel, 1); st.sel = -1; drawProg(); };
    }
    function tapBlock(i) {
      if (st.running || m.done) return;
      if (v === 'debug' && st.phase === 'find') {
        if (i === it.wrong) { st.badMark = i; st.phase = 'edit'; st.sel = i; say(m, 'Ναι! Εκεί είναι το λάθος. Διόρθωσέ το: πάτα ένα βέλος ή άλλαξε τον αριθμό, και μετά ΠΑΜΕ.', 'rusty'); App.sfx.ok(); }
        else { st.okMarks.add(i); m_fail(m, 'Αυτό το κουτάκι είναι σωστό. Ψάξε αλλού!', 'debug_wrong_block'); }
        drawProg(); return;
      }
      if (v === 'predict') return;
      st.sel = st.sel === i ? -1 : i; App.sfx.tap(); drawProg();
    }
    function addBlock(b) {
      if (st.running || m.done) return;
      if (v === 'debug') {
        if (st.phase === 'find') { say(m, 'Πρώτα βρες ποιο κουτάκι είναι λάθος: πάτησέ το.', 'rusty'); return; }
        if (st.sel >= 0) { st.prog[st.sel] = Object.assign({}, b, { n: st.prog[st.sel].n || 1 }); if (b.t === 'jp') delete st.prog[st.sel].n; App.sfx.tap(); drawProg(); return; }
      }
      if (st.sel >= 0 && v === 'build') { const old = st.prog[st.sel]; st.prog[st.sel] = Object.assign({}, b, b.t === 'mv' ? { n: old.n || 1 } : {}); App.sfx.tap(); drawProg(); return; }
      if (st.prog.length >= it.budget) { App.shake('#prog'); say(m, it.counts ? 'Δεν χωράνε άλλα κουτάκια! Βάλε αριθμό σε ένα κουτάκι για πολλά βήματα.' : 'Δεν χωράνε άλλα κουτάκια!'); return; }
      st.prog.push(b); App.sfx.tap(); drawProg();
    }
    $$('#pal [data-d]').forEach(b => b.onclick = () => addBlock({ t: 'mv', d: b.dataset.d, n: 1 }));
    $$('#pal [data-j]').forEach(b => b.onclick = () => addBlock({ t: 'jp', d: b.dataset.j }));
    if ($('#clr')) $('#clr').onclick = () => { if (st.running || v !== 'build') return; st.prog = []; st.sel = -1; drawProg(); };
    $('#run').onclick = () => run();
    /* step through the program, block by block */
    function run() {
      if (st.running || m.done) return;
      if (v === 'predict' && !st.pickCell) { say(m, 'Πρώτα πάτα το τετράγωνο όπου νομίζεις ότι θα σταματήσει.'); return; }
      if (!st.prog.length) { say(m, 'Βάλε πρώτα κουτάκια στο πρόγραμμα!'); return; }
      st.running = true; st.got = new Set(); st.sel = -1;
      const frames = [];
      let prev = 0;
      for (let i = 0; i < st.prog.length; i++) {
        const r = G.codeSim(it, st.prog.slice(0, i + 1));
        for (let j = prev + 1; j < r.path.length; j++) frames.push({ p: r.path[j], b: i });
        prev = r.path.length - 1;
        if (r.fail && r.fail !== 'missed') break;
      }
      const res = G.codeSim(it, st.prog);
      drawBoard(it.start); drawProg(0);
      let f = 0;
      const tick = () => {
        if (f >= frames.length) return done(res);
        const fr = frames[f++];
        placeMover(fr.p); drawProgRun(fr.b);
        const ti = it.targets.findIndex(q => q.x === fr.p.x && q.y === fr.p.y);
        if (ti >= 0 && !st.got.has(ti)) { st.got.add(ti); App.sfx.star(); const g = grid.querySelector(`[data-x="${fr.p.x}"][data-y="${fr.p.y}"] .gem`); if (g) g.classList.add('got'); }
        st.timer = setTimeout(tick, fr.p.jump ? 420 : 280);
      };
      st.timer = setTimeout(tick, 250);
    }
    function drawProgRun(i) { $$('#prog .blk').forEach((b, j) => b.classList.toggle('run', j === i)); }
    function done(res) {
      st.running = false;
      if (v === 'predict') {
        const okp = st.pickCell.x === it.answer.x && st.pickCell.y === it.answer.y;
        drawBoard(res, { end: it.answer });
        if (okp) { App.sfx.ok(); say(m, 'Σωστή πρόβλεψη!'); setTimeout(() => finish(m, true), 800); }
        else { m.attempts++; App.sfx.no(); say(m, 'Σταμάτησε στο πράσινο τετράγωνο. Ας δοκιμάσουμε άλλη πρόβλεψη!'); setTimeout(() => finish(m, false, { err: ['predict_off'] }), 1800); }
        return;
      }
      if (res.ok) {
        App.sfx.ok();
        const extraBlocks = st.prog.length > it.par + 1;
        say(m, extraBlocks ? 'Τα κατάφερες! Μπορεί να γίνει και με λιγότερα κουτάκια.' : pick(C.PRAISE));
        setTimeout(() => finish(m, true, { err: extraBlocks ? ['long_program'] : [] }), 900);
        return;
      }
      const mv = $('#mv'); if (mv) { mv.classList.remove('bump'); void mv.offsetWidth; mv.classList.add('bump'); }
      const msg = { rock: 'Βράχος! Το Dinobot δεν περνάει από βράχους.', water: 'Πλουφ! Πάνω από το νερό χρειάζεται ΑΛΜΑ.', edge: 'Τέλος του χάρτη! Άλλαξε λίγο το πρόγραμμα.', missed: 'Δεν μάζεψε όλους τους κρυστάλλους.', long: 'Πολύ μεγάλο πρόγραμμα!' }[res.fail];
      if (v === 'debug' && st.phase === 'find') { say(m, 'Βλέπεις; Κάπου χαλάει. Πάτα το κουτάκι με το λάθος!', 'rusty'); App.sfx.no(); }
      else m_fail(m, msg, 'run_' + res.fail);
      if (res.block >= 0) { st.sel = res.block; }
      setTimeout(() => { if (!m.done) { drawBoard(it.start); drawProg(); } }, 1100);
    }
    drawBoard(); drawProg();
    say(m, v === 'predict' ? 'Αυτό είναι το πρόγραμμα. Πού θα σταματήσει το Dinobot; Πάτα το τετράγωνο!' : v === 'debug' ? 'Έφτιαξα πρόγραμμα για να μαζέψει τους κρυστάλλους. Δουλεύει τέλεια! …Νομίζω. Βρες το λάθος μου!' : C.FAMS.code.say + (it.jump ? ' Στο νερό: ΑΛΜΑ!' : ''), v === 'debug' ? 'rusty' : 'bip');
    return {
      fit: () => { if (!st.running) drawBoard(); },
      hint(l) {
        if (v === 'predict') {
          const path = G.codeSim(it, it.shown).path;
          if (l === 1) { st.sel = 0; drawProgRun(0); }
          if (l === 2) st.nums = true;
          if (l === 3) st.dots = path.slice(0, Math.ceil(path.length / 2));
          if (l === 4) st.dots = path.slice(0, -1);
          if (l === 5) { st.pickCell = { x: it.answer.x, y: it.answer.y }; $('#run').disabled = false; }
          drawBoard(); return;
        }
        if (v === 'debug') {
          if (l === 3) for (let i = 0; i < it.wrong; i++) st.okMarks.add(i);
          if (l === 4) { st.badMark = it.wrong; st.phase = 'edit'; st.sel = it.wrong; }
          if (l === 5) { st.badMark = it.wrong; st.phase = 'edit'; st.prog = it.solution.map(b => Object.assign({}, b)); st.sel = -1; }
          drawProg(); return;
        }
        if (l === 1) { $$('#cg .gem').forEach(g => g.classList.add('pulse')); }
        if (l === 2) { st.nums = true; drawBoard(); }
        if (l === 3) { st.dots = G.codeSim(it, it.solution).path; drawBoard(); }
        if (l === 4) { st.prog = [Object.assign({}, it.solution[0])]; st.sel = -1; drawProg(); }
        if (l === 5) { st.prog = it.solution.map(b => Object.assign({}, b)); st.sel = -1; drawProg(); }
      },
      autoSolve() {
        if (v === 'predict') { st.pickCell = { x: it.answer.x, y: it.answer.y }; return run(); }
        if (v === 'debug') { st.phase = 'edit'; st.badMark = it.wrong; }
        st.prog = it.solution.map(b => Object.assign({}, b)); drawProg(); run();
      },
      destroy() { clearTimeout(st.timer); }
    };
  }

  /* ======================================================================
   * Κρύσταλλοι
   * ====================================================================== */
  function crystalsCtrl(m, board, ctl) {
    const it = m.item;
    const val = h => h.p * 100 + h.r * 10 + h.s;
    const st = { bank: Object.assign({}, it.have), add: { p: 0, r: 0, s: 0 }, colors: false, guide: false };
    const ITEM_EL = { bridge: 'τη γέφυρα', tower: 'τον πύργο', lamp: 'τη λάμπα', gate: 'την πύλη', pump: 'την αντλία', nest: 'τη φωλιά' };
    let ask;
    if (it.mode === 'pay') ask = `Χρειάζομαι ${it.X} κρυστάλλους για ${ITEM_EL[it.item]}! Βάλε τους στο καλάθι.`;
    else if (it.mode === 'missing') ask = `Στο καλάθι έχω ήδη ${val(it.start)}. Θέλω ${it.X} συνολικά. Βάλε όσους λείπουν!`;
    else ask = `Θέλω δύο πράγματα: ${it.parts[0]} και ${it.parts[1]} κρυστάλλους. Βάλε στο καλάθι όσους κάνουν και τα δύο μαζί!`;
    board.innerHTML = `<div class="shop panel"><div class="bigx" id="bx"></div><div class="lbl">Καλάθι</div><div class="basket" id="bk"></div><div class="lbl">Οι κρύσταλλοί σου (πάτα για να τους βάλεις)</div><div class="bank" id="bn"></div></div>`;
    ctl.insertAdjacentHTML('afterbegin', `<div class="panel"><div class="lbl">Πρέσα κρυστάλλων</div><div class="row press"><button class="btn sm" id="pr">${A.PIECE.r}→ 10 ${A.PIECE.s}</button><button class="btn sm" id="pp">${A.PIECE.p}→ 10 ${A.PIECE.r}</button></div><p class="small">Η πρέσα σπάει μια ράβδο σε 10 θραύσματα.</p><div class="row" style="margin-top:8px"><button class="btn go" id="chk">${I.check}<span>Έτοιμο!</span></button></div></div>`);
    const pieces = (h, where) => ['p', 'r', 's'].map(t => Array.from({ length: h[t] }, () => `<button class="pcb" data-t="${t}" data-w="${where}" aria-label="${t}">${A.PIECE[t]}</button>`).join('')).join('');
    function norm(v) { return { p: Math.floor(v / 100), r: Math.floor(v % 100 / 10), s: v % 10 }; }
    function draw() {
      const digits = String(it.X).split('');
      const dl = digits.length;
      $('#bx').innerHTML = it.mode === 'two' ? `${it.parts[0]} + ${it.parts[1]} = ;` : digits.map((dg, i) => `<span class="${st.colors ? (dl - i === 2 ? 'tn' : dl - i === 1 ? 'on' : '') : ''}">${dg}</span>`).join('');
      const startV = val(it.start);
      let bk = '';
      if (startV) bk += `<span class="basket locked" style="border:0;padding:0;min-height:0;background:none">${pieces(norm(startV), 'x')}</span><span style="width:12px"></span>`;
      bk += pieces(st.add, 'add');
      if (st.guide) { const need = norm(it.need); bk += `<span class="slotguide">${'<span style="display:inline-block;width:22px;height:88px;border:2px dashed #1d1530;border-radius:4px"></span>'.repeat(Math.max(0, need.r - st.add.r))}${'<span style="display:inline-block;width:18px;height:24px;border:2px dashed #1d1530;border-radius:4px"></span>'.repeat(Math.max(0, need.s - st.add.s))}</span>`; }
      $('#bk').innerHTML = bk || '<span class="small">άδειο</span>';
      $('#bn').innerHTML = pieces(st.bank, 'bank') || '<span class="small">τίποτα</span>';
      $$('#bn .pcb').forEach(b => b.onclick = () => move(b.dataset.t, true));
      $$('#bk .pcb[data-w="add"]').forEach(b => b.onclick = () => move(b.dataset.t, false));
      $('#pr').disabled = !st.bank.r; $('#pp').disabled = !st.bank.p;
    }
    function move(t, toBasket) {
      if (m.done) return;
      const from = toBasket ? st.bank : st.add, to = toBasket ? st.add : st.bank;
      if (!from[t]) return;
      from[t]--; to[t]++; App.sfx.tap();
      const startS = it.start.s;
      if (toBasket && t === 's' && startS + st.add.s >= 10 && startS + st.add.s - 1 < 10) say(m, `Δέκα θραύσματα μαζί κάνουν μία ράβδο!`);
      if (st.add.s >= 10) { st.add.s -= 10; st.add.r++; say(m, 'Δέκα θραύσματα έγιναν μία ράβδος!'); }
      draw();
    }
    $('#pr').onclick = () => { if (!st.bank.r) return; st.bank.r--; st.bank.s += 10; App.sfx.dig(); say(m, 'Κρατς! Μία ράβδος έγινε δέκα θραύσματα.'); draw(); };
    $('#pp').onclick = () => { if (!st.bank.p) return; st.bank.p--; st.bank.r += 10; App.sfx.dig(); say(m, 'Κρατς! Μία πλάκα έγινε δέκα ράβδοι.'); draw(); };
    $('#chk').onclick = () => {
      if (m.done) return;
      const total = val(it.start) + val(st.add);
      if (total === it.X) { App.sfx.ok(); say(m, `Ακριβώς ${it.X}! Ευχαριστώ!`); setTimeout(() => finish(m, true), 800); return; }
      const diff = total - it.X;
      m_fail(m, diff < 0 ? 'Λίγοι! Χρειάζομαι κι άλλους.' : 'Πολλοί! Βγάλε μερικούς.', diff < 0 ? (diff > -10 ? 'under_ones' : 'under_tens') : (diff < 10 ? 'over_ones' : 'over_tens'));
    };
    function addExact(onlyTens) {
      const need = it.need - val(st.add);
      if (need < 0) { st.bank.p += st.add.p; st.bank.r += st.add.r; st.bank.s += st.add.s; st.add = { p: 0, r: 0, s: 0 }; return addExact(onlyTens); }
      const n = norm(need);
      while (st.bank.p < n.p) return;
      st.bank.p -= n.p; st.add.p += n.p;
      while (st.bank.r < n.r && st.bank.p) { st.bank.p--; st.bank.r += 10; }
      st.bank.r -= Math.min(n.r, st.bank.r); st.add.r += n.r;
      if (!onlyTens) { while (st.bank.s < n.s && st.bank.r) { st.bank.r--; st.bank.s += 10; } st.bank.s -= n.s; st.add.s += n.s; if (st.add.s >= 10) { st.add.s -= 10; st.add.r++; } }
    }
    draw(); say(m, ask);
    return {
      fit: draw,
      hint(l) {
        if (l === 1) st.colors = true;
        if (l === 3) st.guide = true;
        if (l === 4) addExact(true);
        if (l === 5) addExact(false);
        draw();
      },
      autoSolve() { addExact(false); draw(); $('#chk').click(); }
    };
  }

  /* ======================================================================
   * Τα λάθη του Σκουριά
   * ====================================================================== */
  function mistakeCtrl(m, board, ctl) {
    const it = m.item;
    const st = { phase: 'judge', ok: new Set(), bad: -1, hl: -1, fixed: false };
    const col = !it.inline && it.type !== 'pv';
    board.innerHTML = `<div style="display:flex;flex-direction:column;gap:16px;align-items:center;width:100%"><div class="steps ${col ? 'col' : ''}" id="steps"></div><div class="choices" id="chs"></div></div>`;
    function stepHTML(s, i) {
      const inner = s.rods != null ? `<span class="pcs">${A.PIECE.r.repeat(s.rods)}${A.PIECE.s.repeat(s.shards)}</span>` : App.esc(s.t);
      const cls = 'step' + (st.ok.has(i) ? ' ok' : '') + (st.bad === i ? ' bad' : '') + (st.hl === i ? ' hl' : '');
      return `<button class="${cls}" data-i="${i}">${inner}</button>`;
    }
    function draw() {
      $('#steps').innerHTML = it.steps.map(stepHTML).join('');
      $$('#steps .step').forEach(b => b.onclick = () => tapStep(+b.dataset.i));
      let ch = '';
      if (st.phase === 'judge') ch = `<button class="btn go" id="yes">${I.check}<span>Έχει δίκιο</span></button><button class="btn rd" id="no">${I.x}<span>Κάτι είναι λάθος</span></button>`;
      if (st.phase === 'fix') ch = it.opts.map((o, i) => `<button class="btn" data-o="${i}" style="font-size:1.4rem">${App.esc(o)}</button>`).join('');
      $('#chs').innerHTML = ch;
      if ($('#yes')) { $('#yes').onclick = () => judge(true); $('#no').onclick = () => judge(false); }
      $$('#chs [data-o]').forEach(b => b.onclick = () => fix(it.opts[+b.dataset.o]));
    }
    function judge(right) {
      if (m.done) return;
      if (right && it.wrong === -1) { App.sfx.ok(); it.steps.forEach((_, i) => st.ok.add(i)); draw(); say(m, 'Χα! Αυτή τη φορά είχα δίκιο!', 'rusty'); return setTimeout(() => finish(m, true), 900); }
      if (right) return m_fail(m, 'Είσαι σίγουρος; Κοίτα ξανά ένα-ένα.', 'missed_error');
      if (it.wrong === -1) return m_fail(m, 'Έλεγξε ξανά… μήπως όλα είναι σωστά;', 'false_alarm');
      st.phase = 'find'; App.sfx.tap(); draw();
      say(m, 'Χμ! Πού έκανα το πρώτο λάθος; Πάτησέ το!', 'rusty');
    }
    function tapStep(i) {
      if (m.done || st.phase !== 'find') return;
      if (i === it.wrong) { st.bad = i; st.phase = 'fix'; App.sfx.ok(); draw(); say(m, 'Ωχ! Ναι, εκεί. Ποια είναι η σωστή διόρθωση;', 'rusty'); return; }
      if (i < it.wrong || (it.type === 'pattern' && i !== it.wrong)) { st.ok.add(i); draw(); return m_fail(m, i < it.wrong ? 'Αυτό είναι σωστό. Το λάθος είναι πιο μετά.' : 'Ψάξε το ΠΡΩΤΟ λάθος.', 'wrong_step'); }
      st.ok.add(i); draw(); m_fail(m, 'Ψάξε το ΠΡΩΤΟ λάθος, πιο πριν!', 'later_step');
    }
    function fix(o) {
      if (m.done) return;
      if (o === it.fix) {
        it.steps[st.bad] = it.steps[st.bad].rods != null ? it.steps[st.bad] : { t: o };
        if (it.type === 'pv') it.steps[1] = { t: o };
        st.ok.add(st.bad); st.bad = -1; App.sfx.ok(); draw();
        m.explain = m.attempts === 1 && m.hint < 3;
        say(m, 'Ευχαριστώ! Τώρα είναι σωστό. Πώς το βρήκες;!', 'rusty');
        return setTimeout(() => finish(m, true), 1000);
      }
      m_fail(m, 'Αυτό δεν διορθώνει το λάθος. Δοκίμασε άλλο!', 'wrong_fix');
    }
    draw(); say(m, it.type === 'pattern' ? 'Έφτιαξα ένα μοτίβο με αυγά! Έχω δίκιο;' : it.type === 'skip' ? `Μετράω ανά ${it.by}! Έχω δίκιο;` : it.type === 'pv' ? 'Μέτρησα τους κρυστάλλους! Έχω δίκιο;' : 'Το έλυσα βήμα-βήμα! Έχω δίκιο;', 'rusty');
    return {
      fit: () => { },
      hint(l) {
        if (it.wrong === -1) { if (l >= 3) { it.steps.forEach((_, i) => st.ok.add(i)); draw(); } return; }
        if (l === 3) { for (let i = 0; i < it.wrong; i++) st.ok.add(i); }
        if (l === 4) { st.hl = it.wrong; if (st.phase !== 'fix') { st.phase = 'find'; } }
        if (l === 5) { st.bad = it.wrong; st.phase = 'fix'; st.hl = -1; }
        draw();
        if (l === 5) $$('#chs [data-o]').forEach(b => { if (it.opts[+b.dataset.o] === it.fix) b.classList.add('pulse'); });
      },
      autoSolve() {
        if (it.wrong === -1) return judge(true);
        judge(false); tapStep(it.wrong); fix(it.fix);
      }
    };
  }

  /* ======================================================================
   * Πείραμα: ράμπες
   * ====================================================================== */
  const SURF_EL = { sand: 'άμμος', grass: 'γρασίδι', ice: 'πάγος' }, SURF_COL = { sand: '#e8c872', grass: '#5cc15c', ice: '#bfefff' };
  const ANG_EL = { 1: 'χαμηλή', 2: 'μεσαία', 3: 'απότομη' }, RH = [0, 45, 80, 115];
  function laneSVG(set, y0, label, opts) {
    opts = opts || {};
    const fy = y0 + 150, h = RH[set.a], c = SURF_COL[set.s];
    let s = opts.mini ? '' : `<text x="400" y="${y0 + 26}" font-size="22" font-weight="900" fill="var(--ink)">${label}</text>`;
    s += `<path d="M40 ${fy} L300 ${fy} L40 ${fy - h}Z" fill="#c9b8a0" stroke="${K}" stroke-width="3" stroke-linejoin="round"/>`;
    s += `<path d="M40 ${fy - h} L300 ${fy}" stroke="${c}" stroke-width="9" stroke-linecap="round"/><path d="M40 ${fy - h} L300 ${fy}" stroke="${K}" stroke-width="1.5" stroke-dasharray="${set.s === 'sand' ? '2 5' : set.s === 'grass' ? '1 3' : '18 8'}"/>`;
    s += `<text x="${opts.mini ? 40 : 120}" y="${fy + (opts.mini ? 30 : 22)}" font-size="${opts.mini ? 26 : 15}" font-weight="700" fill="var(--ink)">${opts.mini ? label + ': ' : ''}${ANG_EL[set.a]} · ${SURF_EL[set.s]}</text>`;
    if (opts.mini) return s;
    s += `<path d="M300 ${fy} L790 ${fy}" stroke="${K}" stroke-width="3"/>`;
    for (let z = 1; z <= 6; z++) {
      const x = 320 + (z - 1) * 78;
      const on = opts.pick === z, ans = opts.ans === z;
      s += `<g class="zone" data-z="${z}" data-lane="${opts.lane || ''}"><rect x="${x}" y="${fy - 40}" width="74" height="40" rx="6" fill="${ans ? '#c9f5dd' : on ? '#ffd21f' : 'rgba(255,255,255,.35)'}" stroke="${K}" stroke-width="${on || ans ? 3 : 1.5}"/><text x="${x + 37}" y="${fy - 13}" text-anchor="middle" font-size="18" font-weight="900" fill="#1d1530">${z}</text></g>`;
    }
    if (opts.egg != null) s += eggAt(opts.egg, y0);
    return s;
  }
  function eggXY(t, set, y0) {                     // t: 0..1 along ramp then floor to the zone
    const fy = y0 + 150, h = RH[set.a], zx = 320 + (G.rampDist(set.a, set.s) - 0.5) * 78;
    const L1 = Math.hypot(260, h), L2 = zx - 300, tot = L1 + L2, d = t * tot;
    if (d < L1) { const u = d / L1; return [40 + 260 * u, fy - h + h * u - 13]; }
    return [300 + (d - L1), fy - 13];
  }
  const eggAt = (p, y0) => `<g transform="translate(${p[0]} ${p[1]})"><ellipse rx="11" ry="13" fill="#fff8ea" stroke="${K}" stroke-width="2.5"/><circle cx="-3" cy="-4" r="2.5" fill="#46b06a"/><circle cx="4" cy="3" r="2" fill="#46b06a"/></g>`;
  function rampCtrl(m, board, ctl) {
    const it = m.item, v = it.variant;
    const st = { pick: null, ran: false, elim: new Set(), anim: 0 };
    board.innerHTML = `<div class="lab panel" style="width:100%;max-width:900px" id="lab"></div>`;
    ctl.insertAdjacentHTML('afterbegin', `<div class="panel" id="rq"></div>`);
    const lanes = () => v === 'compare' ? [{ set: it.A, label: 'Α' }, { set: it.B, label: 'Β' }] : v === 'zone' ? it.refs.map((r, i) => ({ set: r, label: 'Δοκιμή ' + (i + 1), ref: true })).concat([{ set: it.T, label: 'Νέα ράμπα', target: true }]) : [];
    function draw(eggs) {
      if (v === 'fair') return drawFair();
      const L = lanes();
      let s = '';
      L.forEach((ln, i) => { s += laneSVG(ln.set, i * 180, ln.label, { lane: ln.target ? 't' : '', pick: ln.target ? st.pick : null, ans: (ln.ref || (st.ran && ln.target)) ? G.rampDist(ln.set.a, ln.set.s) : null, egg: eggs ? eggs[i] : (ln.ref ? eggXY(1, ln.set, i * 180) : eggXY(0, ln.set, i * 180)) }); });
      $('#lab').innerHTML = `<svg viewBox="0 0 800 ${L.length * 180}" role="img" aria-label="ράμπες">${s}</svg>`;
      $$('#lab .zone[data-lane="t"]').forEach(z => z.addEventListener('click', () => { if (st.ran || m.done) return; st.pick = +z.dataset.z; App.sfx.tap(); draw(); drawQ(); }));
    }
    function animate(then) {
      const L = lanes(), t0 = performance.now(), dur = 1800;
      const step = tt => {
        const u = Math.min(1, (tt - t0) / dur), e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
        draw(L.map((ln, i) => eggXY(ln.ref ? 1 : e, ln.set, i * 180)));
        if (u < 1) st.anim = requestAnimationFrame(step); else then && then();
      };
      st.anim = requestAnimationFrame(step);
    }
    function drawQ() {
      const q = $('#rq');
      if (v === 'compare') {
        if (st.ran) return;
        q.innerHTML = `<div class="lbl">Πρόβλεψη</div><p>Ποιο αυγό θα κυλήσει πιο μακριά;</p><div class="choices">${['A', 'B', 'same'].map(o => `<button class="btn ${st.pick === o ? 'sel' : ''}" data-p="${o}" ${st.elim.has(o) ? 'disabled' : ''}>${o === 'A' ? 'Το Α' : o === 'B' ? 'Το Β' : 'Ίδια'}</button>`).join('')}</div><div class="row" style="margin-top:8px"><button class="btn go" id="test" ${st.pick ? '' : 'disabled'}>${I.play}<span>ΔΟΚΙΜΗ</span></button></div>`;
        $$('#rq [data-p]').forEach(b => b.onclick = () => { st.pick = b.dataset.p; App.sfx.tap(); drawQ(); });
      } else if (v === 'zone') {
        if (st.ran) return;
        q.innerHTML = `<div class="lbl">Πρόβλεψη</div><p>Δες τη δοκιμή. Πού θα σταματήσει το αυγό στη νέα ράμπα; Πάτα έναν αριθμό.</p><div class="row"><button class="btn sm" id="replay">${I.eye}<span>Δες ξανά</span></button><button class="btn go" id="test" ${st.pick ? '' : 'disabled'}>${I.play}<span>ΔΟΚΙΜΗ</span></button></div>`;
        $('#replay').onclick = () => { const L = lanes(); const t0 = performance.now(); const stp = tt => { const u = Math.min(1, (tt - t0) / 1500); draw(L.map((ln, i) => eggXY(ln.ref ? u : 0, ln.set, i * 180))); if (u < 1) st.anim = requestAnimationFrame(stp); }; st.anim = requestAnimationFrame(stp); };
      }
      const tb = $('#test'); if (tb) tb.onclick = test;
    }
    function test() {
      if (st.ran || m.done || !st.pick) return;
      st.ran = true; $('#rq').innerHTML = '<p>Κοίτα!</p>';
      animate(() => {
        let ok;
        if (v === 'compare') ok = st.pick === it.answer;
        else ok = Math.abs(st.pick - it.answer) <= it.tol;
        draw();
        if (ok) { App.sfx.ok(); say(m, v === 'zone' && st.pick !== it.answer ? `Πολύ κοντά! Σταμάτησε στο ${it.answer}.` : 'Σωστή πρόβλεψη!'); }
        else { App.sfx.no(); say(m, v === 'zone' ? `Σταμάτησε στο ${it.answer}. Ας δούμε γιατί.` : 'Δεν πήγε όπως το περιμέναμε. Ας δούμε γιατί.'); }
        setTimeout(() => why(ok), 1100);
      });
    }
    function why(predOk) {
      let q, opts, good;
      const changed = v === 'compare' ? it.why : (it.refs[0].a !== it.T.a && it.refs[0].s !== it.T.s ? 'both' : it.refs[0].a !== it.T.a ? 'angle' : 'surface');
      if (changed === 'angle') { q = predOk ? 'Γιατί;' : 'Τι μάθαμε;'; opts = ['Πιο απότομη ράμπα = πιο μακριά', 'Το χρώμα της ράμπας', 'Το ένα αυγό ήταν πιο τυχερό']; good = 0; }
      else if (changed === 'surface') { q = predOk ? 'Γιατί;' : 'Τι μάθαμε;'; opts = ['Ο πάγος γλιστράει, η άμμος φρενάρει', 'Το χρώμα της ράμπας', 'Το ένα αυγό ήταν πιο τυχερό']; good = 0; }
      else { q = 'Τι άλλαξε;'; opts = ['Και η κλίση και η επιφάνεια', 'Μόνο το αυγό', 'Τίποτα']; good = 0; }
      askWhy(q, opts, good, okw => {
        m.explain = okw && m.hint < 3;
        if (!predOk) m.attempts = 2;

  /* ======================================================================

  const PX = (x) => (x / 8 * 100) + '%', PY = (y) => (y / 5 * 100) + '%';

      if (t === 'sens') { s.cond.s = el.dataset.s; if (s.cond.s === 'cnt' && s.cond.n == null) s.cond.n = opts.target || 2; }
      if (t === 'cplus') s.cond.n = Math.min(9, (s.cond.n || 0) + 1);
      if (t === 'cminus') s.cond.n = Math.max(0, (s.cond.n || 0) - 1);
      if (t === 'not') s.cond.not = !s.cond.not;
      if (t === 'else') s.else = s.else ? null : [];
      if (t === 'del') { remove(s.id); }
      if (t === 'sens' && opts.speak) opts.speak(SENSOR_EL[s.cond.s]);
      changed();
    }
    function wire() {
      host.querySelectorAll('.tab').forEach(b => b.onclick = () => { st.tab = b.dataset.tab; st.sel = null; const list = st.tab === 'main' ? st.prog.main : st.prog.fns[st.tab]; st.cursor = { path: st.tab === 'main' ? 'main' : 'fns.' + st.tab, i: list.length }; render(); });
      if (st.ro) return;
      host.querySelectorAll('.gap').forEach(g => g.addEventListener('click', e => { e.stopPropagation(); st.cursor = { path: g.dataset.gpath, i: +g.dataset.gi }; st.sel = null; render(); }));
      host.querySelectorAll('.tb').forEach(b => b.onclick = e => { e.stopPropagation(); tool(b.dataset.t, b); });
      host.querySelectorAll('.cnd').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); st.sel = b.dataset.cnd; render(); }));
      host.querySelectorAll('.ed-prog .b').forEach(b => b.addEventListener('pointerdown', e => startDrag(e, b, false)));
      host.querySelectorAll('.ed-pal .b').forEach(b => b.addEventListener('pointerdown', e => startDrag(e, b, true)));
    }
    /* drag: from palette (new block) or from the program (move); a short press without moving is a tap */
    function startDrag(e, el, fromPal) {
      if (e.target.closest('.cnd') || e.target.closest('.tb')) return;
      e.preventDefault(); e.stopPropagation();
      const d = { el, fromPal, x0: e.clientX, y0: e.clientY, moved: false, ghost: null, id: el.dataset.id };
      st.drag = d;
      const move = ev => {
        if (!d.moved && Math.hypot(ev.clientX - d.x0, ev.clientY - d.y0) > 10) {
          d.moved = true; host.querySelector('.ed').classList.add('dragging');
          d.ghost = el.cloneNode(true); d.ghost.classList.add('ghost'); document.body.appendChild(d.ghost);
        }
        if (d.ghost) {
          d.ghost.style.left = (ev.clientX - 30) + 'px'; d.ghost.style.top = (ev.clientY - 20) + 'px';
          host.querySelectorAll('.gap.hot').forEach(g => g.classList.remove('hot'));
          const g = gapAt(ev.clientX, ev.clientY); if (g) g.classList.add('hot');
        }
      };
      const up = ev => {
        window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
        st.drag = null;
        if (d.ghost) d.ghost.remove();
        const edEl = host.querySelector('.ed'); if (edEl) edEl.classList.remove('dragging');
        if (!d.moved) { tap(el, fromPal); return; }
        const g = gapAt(ev.clientX, ev.clientY);
        if (fromPal) { if (g) insert(make(el.dataset.op, el.dataset.x), g.dataset.gpath, +g.dataset.gi); else render(); return; }
        // moving a placed block
        if (!g) { const overPal = document.elementFromPoint(ev.clientX, ev.clientY); if (overPal && overPal.closest('.ed-pal')) { remove(d.id); changed(); } else render(); return; }
        const gpath = g.dataset.gpath; let gi = +g.dataset.gi;
        const f = findById(st.prog, d.id);
        if (!f || gpath.startsWith(f.path + '.' + f.i + '.')) { render(); return; }      // cannot drop a block inside itself
        if (gpath === f.path && gi > f.i) gi--;
        const b = remove(d.id); const list = getList(st.prog, gpath); list.splice(gi, 0, b); st.cursor = { path: gpath, i: gi + 1 }; changed();
      };
      window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
    }
    function gapAt(x, y) {
      const el = document.elementFromPoint(x, y); if (!el) return null;
      const g = el.closest && el.closest('.gap'); if (g) return g;
      const b = el.closest && el.closest('.ed-prog .b');
      if (b) { const r = b.getBoundingClientRect(); const path = b.dataset.path, i = +b.dataset.i; if (b.classList.contains('cb') && y > r.top + 30 && y < r.bottom - 10) return null; return host.querySelector(`.gap[data-gpath="${path}"][data-gi="${y < r.top + r.height / 2 ? i : i + 1}"]`); }
      const pr = el.closest && el.closest('.ed-prog'); if (pr) { const list = st.tab === 'main' ? 'main' : 'fns.' + st.tab; return host.querySelector(`.gap[data-gpath="${list}"][data-gi="${getList(st.prog, list).length}"]`); }
      return null;
    }
    function tap(el, fromPal) {
      if (fromPal) { const op = el.dataset.op; if (opts.speak) opts.speak(OP[op].say); insert(make(op, el.dataset.x), st.cursor.path, st.cursor.i); return; }
      st.sel = st.sel === el.dataset.id ? null : el.dataset.id;
      if (st.sel && opts.speak) { const f = findById(st.prog, st.sel); if (f) opts.speak(OP[f.s.op].say); }
      render();
    }

    render();
    return {
      get program() { return st.prog; },
      set program(p) { st.prog = p; if (hasFn) { st.prog.fns = st.prog.fns || {}; if (!st.prog.fns.A) st.prog.fns.A = []; } st.sel = null; st.marks = {}; st.tab = 'main'; st.cursor = { path: 'main', i: p.main.length }; render(); },
      setReadOnly(v) { st.ro = v; render(); },
      highlight(id) { host.querySelectorAll('.b.run').forEach(b => b.classList.remove('run')); if (id) { const b = host.querySelector(`.ed-prog .b[data-id="${id}"]`); if (b) { b.classList.add('run'); b.scrollIntoView({ block: 'nearest' }); } else if (hasFn && st.tab === 'main') { /* inside a function: show it on the main call */ } } },
      mark(id, cls) { if (cls) st.marks[id] = cls; else delete st.marks[id]; render(); },
      clearMarks() { st.marks = {}; render(); },
      count, render, showTab(t) { st.tab = t; render(); }
    };
  }
  return { create, SENSOR_EL, OP, getList, findById };
})();

/* ---- games/dinobots/src/codeui.js ---- */
/* DINOBOTS 3D code puzzles: the mission screen that joins the block editor and the 3D diorama.
 * Build mode (one program for every island), predict mode and Σκουριάς debug mode. */
/* global App, DinoCode, BlockEditor, Puzzle3D, D3 */
(function () {
  'use strict';
  const { E, C, A, I, $, $$ } = App;
  const DC = DinoCode;

  const WHY = {
    rock: 'Βράχος μπροστά! Το Dinobot δεν περνάει από βράχους.', edge: 'Τέλος του νησιού! Θα έπεφτε στη θάλασσα.',
    water: 'Πλουφ! Πάνω από νερό χρειάζεται ΠΗΔΑ.', step_up: 'Ψηλό σκαλί! Εδώ χρειάζεται ΠΗΔΑ.', step_down: 'Χαμηλό σκαλί! Εδώ χρειάζεται ΠΗΔΑ.',
    jump_flat: 'Εδώ δεν υπάρχει σκαλί ή νερό για να πηδήξει.', jump_water: 'Το νερό είναι πολύ φαρδύ για πήδημα.',
    dig_empty: 'Δεν υπάρχει σημάδι εδώ για σκάψιμο!', dig_twice: 'Εδώ έσκαψε ήδη!', tired: 'Το Dinobot κουράστηκε: το πρόγραμμα δεν σταματάει ποτέ!',
    crystals: 'Δεν μάζεψε όλους τους κρυστάλλους.', flag: 'Δεν έφτασε στη σημαία.', fossils: 'Δεν έσκαψε όλα τα απολιθώματα.', end: 'Δεν σταμάτησε στο σωστό σημείο.'
  };
  const PULSE = { code_seq: 'gem', code_rel: 'gem', code_loop: 'step', code_cond: 'mark', code_until: 'color', code_func: 'gem', code_count: 'color' };

  App.startCode = function (opt) {
    const ST = App.ST, EN = App.EN;
    const fam = opt.fam, kind = opt.kind || 'edge';
    let d = opt.d != null ? opt.d : E.levelForFamily(EN, fam, kind === 'fade' ? 'edge' : kind);
    d = Math.max(1, Math.min(10, d + (opt.bump || 0)));
    App.S.nonce = (App.S.nonce || 0) + 1;
    const seed = ST.seed + '|' + fam + '|' + ST.missions + '|' + App.S.nonce;
    const item = DC.generate(fam, seed, d, kind === 'fade' || kind === 'retrieval' ? 'edge' : kind);
    const m = { fam, kind, d, seed, item, origin: opt.origin || { type: 'free' }, replay: !!opt.replay, t0: App.now(), hint: 0, attempts: 1, rapid: 0, explain: false, done: false, onDone: opt.onDone || null, taps: [], runs: 0 };
    const intro = !ST.tips['intro_' + fam] && item.variant === 'build';
    App.go('mission');
    App.S.m = m;
    render(m, intro);
  };

  function render(m, intro) {
    const it = m.item, ST = App.ST, sp = ST.active || App.dinoList()[0] || 'trex';
    const who = it.variant === 'debug' ? 'rusty' : 'bip';
    const title = (C.CODE[m.fam] || {}).title + (C.KIND_BADGE[m.kind] ? ' · ' + C.KIND_BADGE[m.kind] : '');
    $('#app').innerHTML = `<div class="screen s3d">${App.barHTML(title, true)}
      <div class="c3d"><div class="c3d-left">${App.talkHTML('', who)}
        <div class="isles" id="isles">${it.maps.map((_, i) => `<button class="isle ${i === 0 ? 'on' : ''}" data-i="${i}">${it.maps.length > 1 ? 'Νησί ' + (i + 1) : 'Νησί'}<span class="st"></span></button>`).join('')}</div>
        <div class="runbar"><button class="btn go" id="run">${I.play}<span>${it.variant === 'predict' ? 'Δες!' : 'ΠΑΜΕ'}</span></button><button class="btn sq" id="stop" aria-label="Σταμάτα">${I.stop}</button><button class="btn sq" id="spd" aria-label="Ταχύτητα">🐢</button></div>
        <div class="row helpbar"><button class="btn yl" id="hintb">${I.bulb}<span>Βοήθεια</span></button><button class="btn sm" id="skipb">Άλλο</button></div>
      </div><div class="c3d-ed panel" id="ed"></div></div></div>`;
    App.wireSay(); $('#face').dataset.who = who;
    $('#back').onclick = () => leave(m);
    const sc = Puzzle3D.create({});
    App.gl(true); D3.show(sc);
    sc.onSound = k => App.sfx[k] && App.sfx[k]();
    let isle = 0, speed = 1;
    sc.build(it.maps[0], sp, ST.dinos[sp]);
    const startProg = it.variant === 'predict' ? DC.clone(it.ref) : it.variant === 'debug' ? DC.clone(it.shown) : { main: [], fns: {} };
    const ed = BlockEditor.create($('#ed'), { program: startProg, palette: it.palette, limit: it.limit, readOnly: it.variant === 'predict', target: it.target, speak: t => App.speak(t), onLimit: () => App.bubble('Δεν χωράνε άλλα μπλοκ! Μήπως μια ΕΠΑΝΑΛΗΨΗ ή ένα δικό σου ΜΠΛΟΚ;'), onChange: () => { sc.showEnd(null); } });
    m.ed = ed; m.sc = sc;
    const setIsle = i => { isle = i; $$('.isle').forEach(b => b.classList.toggle('on', +b.dataset.i === i)); sc.build(it.maps[i], sp, ST.dinos[sp]); if (m.pick != null) sc.showEnd(m.pick); };
    $$('.isle').forEach(b => b.onclick = () => { if (!m.running) setIsle(+b.dataset.i); });
    $('#spd').onclick = () => { speed = speed === 1 ? 2.2 : speed === 2.2 ? 0.6 : 1; $('#spd').textContent = speed === 1 ? '🐢' : speed > 1 ? '🐇' : '🐌'; };
    $('#stop').onclick = () => { m.stop = true; sc.reset(); ed.highlight(null); m.running = false; };
    $('#hintb').onclick = () => hint(m, sc, ed);
    $('#skipb').onclick = () => { const ov = App.overlay(`<h2>Άλλο πρόβλημα;</h2><p>Κανένα πρόβλημα! Θα δοκιμάσουμε κάτι λίγο διαφορετικό.</p><div class="row"><button class="btn" id="sn">Όχι, συνεχίζω</button><button class="btn yl" id="sy">Ναι, άλλο</button></div>`); ov.querySelector('#sn').onclick = App.closeOv; ov.querySelector('#sy').onclick = () => { App.closeOv(); App._finish(m, false, { err: ['skipped'], skipped: true }); }; };
    if (it.variant === 'predict') sc.onTap = (x, y) => { if (m.running || m.done) return; const c = sc.cellAtScreen(x, y); if (c) { m.pick = c; sc.showEnd(c); App.sfx.tap(); } };
    $('#run').onclick = () => run(m, sc, ed, () => isle, setIsle, () => speed);
    m.ctrl = {
      destroy() { m.stop = true; },
      autoSolve() { if (it.variant === 'predict') { m.pick = { x: it.answer.x, y: it.answer.y }; sc.showEnd(m.pick); } else ed.program = DC.clone(it.ref); speed = 3; run(m, sc, ed, () => isle, setIsle, () => speed); }
    };
    const say = it.variant === 'predict' ? 'Αυτό είναι το πρόγραμμα. Πού θα σταματήσει το Dinobot; Πάτα το πλακάκι στο νησί!'
      : it.variant === 'debug' ? 'Έφτιαξα πρόγραμμα, αλλά κάπου δεν δουλεύει. Διόρθωσέ το!'
        : (m.fam === 'code_count' ? `Το απολίθωμα είναι κάτω από το ${it.target}ο κόκκινο πλακάκι. Σκάψε εκεί!` : (C.CODE[m.fam] || {}).say) + (it.maps.length > 1 ? ' Το ΙΔΙΟ πρόγραμμα πρέπει να δουλέψει σε όλα τα νησιά!' : '');
    App.bubble(say, who);
    if (intro) showIntro(m, sc, ed);
  }

  function leave(m) {
    m.stop = true;
    if (m.origin.type === 'match') return App.go('base');
    App.go(['lab', 'fossil', 'base'].includes(m.origin.type) ? 'base' : 'map');
  }

  async function run(m, sc, ed, getIsle, setIsle, getSpeed) {
    if (m.running || m.done) return;
    const it = m.item;
    if (it.variant === 'predict') {
      if (!m.pick) { App.bubble('Πρώτα πάτα το πλακάκι όπου νομίζεις ότι θα σταματήσει.'); return; }
      m.running = true; m.stop = false;
      setIsle(0);
      const res = DC.run(it.maps[0], it.ref);
      await sc.play(res, getSpeed(), e => ed.highlight(e.id));
      ed.highlight(null); m.running = false;
      const ok = m.pick.x === it.answer.x && m.pick.y === it.answer.y;
      sc.showEnd(it.answer, ok ? '#7dffbc' : '#ffd21f');
      if (ok) { App.sfx.ok(); App.bubble('Σωστή πρόβλεψη!'); setTimeout(() => App._finish(m, true), 900); }
      else { App.sfx.no(); m.attempts++; App.bubble('Σταμάτησε στον πράσινο κύκλο. Ας δοκιμάσουμε άλλη πρόβλεψη!'); setTimeout(() => App._finish(m, false, { err: ['predict_off'] }), 1800); }
      return;
    }
    const prog = ed.program;
    if (!prog.main.length) { App.bubble('Βάλε πρώτα μπλοκ στο πρόγραμμα!'); return; }
    if (DC.progSize(prog) > it.limit) { App.bubble(`Πάρα πολλά μπλοκ! Το όριο είναι ${it.limit}.`); return; }
    m.running = true; m.stop = false; m.runs++;
    $$('.isle .st').forEach(s => { s.textContent = ''; });
    for (let i = 0; i < it.maps.length; i++) {
      if (m.stop) break;
      setIsle(i);
      await new Promise(r => setTimeout(r, 250));
      const res = DC.run(it.maps[i], prog);
      const out = await sc.play(res, getSpeed(), e => ed.highlight(e.id));
      ed.highlight(null);
      if (out === 'cancel' || m.stop) { m.running = false; return; }
      const mark = $(`.isle[data-i="${i}"] .st`);
      if (!res.ok) {
        if (mark) mark.textContent = '✗';
        const why = WHY[res.stop] || WHY[res.miss] || 'Κάτι δεν πήγε καλά.';
        m.attempts++;
        if (res.at) ed.mark(res.at, 'bad');
        App.sfx.no();
        App.bubble((it.maps.length > 1 ? `Νησί ${i + 1}: ` : '') + why + (m.attempts >= 3 && m.hint < 5 ? ' Πάτα τη λάμπα αν θέλεις βοήθεια.' : ''));
        if (m.attempts >= 3) $('#hintb').classList.add('pulse');
        (m.errs = m.errs || []).push('run_' + (res.stop || res.miss));
        m.running = false;
        setTimeout(() => { if (!m.done && res.at) ed.mark(res.at, null); }, 2500);
        return;
      }
      if (mark) mark.textContent = '✓';
    }
    m.running = false;
    if (m.stop) return;
    App.sfx.ok();
    const elegant = DC.progSize(prog) <= it.par;
    m.explain = it.variant === 'debug' ? (m.runs <= 2 && m.hint < 3) : (elegant && m.hint < 3 && it.maps.length > 1);
    App.bubble(elegant ? 'Τέλειο πρόγραμμα, και με λίγα μπλοκ!' : 'Τα κατάφερες! Μπορεί να γίνει και με λιγότερα μπλοκ.');
    setTimeout(() => App._finish(m, true, { err: elegant ? [] : ['long_program'] }), 1100);
  }

  function hint(m, sc, ed) {
    if (m.done || m.running) return;
    m.hint = Math.min(5, m.hint + 1);
    const it = m.item, H = (C.CODE[m.fam] || {}).hints || [];
    const txt = it.variant === 'predict' ? C.HINTS.predict[m.hint - 1] : it.variant === 'debug' ? C.HINTS.debug[m.hint - 1] : H[m.hint - 1] || '';
    App.bubble(txt); App.sfx.tap(); $('#hintb').classList.remove('pulse');
    if (m.hint === 1) sc.pulse(PULSE[m.fam] || 'gem');
    if (it.variant === 'predict') {
      const path = DC.run(it.maps[0], it.ref).trace.filter(e => e.a === 'move' || e.a === 'jump').map(e => [e.x, e.y]);
      if (m.hint === 3) sc.showDots(path.slice(0, Math.ceil(path.length / 2)));
      if (m.hint === 4) sc.showDots(path.slice(0, -1));
      if (m.hint === 5) { m.pick = { x: it.answer.x, y: it.answer.y }; sc.showEnd(m.pick); }
      return;
    }
    if (m.hint >= 3) {
      const prog = DC.skeleton(it.ref, m.hint);
      const fresh = p => { DC.withIds(p.main); Object.values(p.fns || {}).forEach(DC.withIds); return p; };
      ed.program = fresh(DC.clone(prog));
    }
  }

  /* "new ability" lesson: shows the block, then a tiny demo puzzle solved by ΜΠΙΠ, then hands over */
  function showIntro(m, sc, ed) {
    const L = (C.CODE[m.fam] || {}).lesson;
    if (!L) return;
    const ov = App.overlay(`<h2>Νέα ικανότητα!</h2><div class="lesson-block">${L.block}</div><p>${App.esc(L.text)}</p><div class="row"><button class="btn" id="lskip">Το ξέρω!</button><button class="btn go" id="lshow">${I.eye}<span>Δείξε μου</span></button></div>`, 'lesson');
    App.speak('Νέα ικανότητα! ' + L.text);
    const done = () => { App.closeOv(); App.ST.tips['intro_' + m.fam] = 1; App.save(); };
    ov.querySelector('#lskip').onclick = done;
    ov.querySelector('#lshow').onclick = async () => {
      App.closeOv();
      const demo = DC.generate(m.fam, 'lesson', 1, 'edge');
      const keep = ed.program;
      ed.program = DC.clone(demo.ref); ed.setReadOnly(true);
      App.bubble('Κοίτα πώς το λύνω εγώ!');
      for (let i = 0; i < demo.maps.length; i++) {
        sc.build(demo.maps[i], App.ST.active || 'trex', App.ST.dinos[App.ST.active]);
        await new Promise(r => setTimeout(r, 300));
        await sc.play(DC.run(demo.maps[i], demo.ref), 1.3, e => ed.highlight(e.id));
      }
      ed.highlight(null); ed.setReadOnly(false); ed.program = keep;
      sc.build(m.item.maps[0], App.ST.active || 'trex', App.ST.dinos[App.ST.active]);
      App.bubble('Τώρα εσύ! ' + (C.CODE[m.fam] || {}).say);
      done();
    };
  }
})();

/* DINOBOTS 3D screens: title, island map, workshop turntable, museum turntable.
 * They replace the 2D versions when WebGL and three.js are available (App.has3D). */
/* global App, D3, Hub3D, M3, THREE */
(function () {
  'use strict';
  const { C, A, I, $, $$ } = App;
  App.screens = App.screens || {};
  const ICONS = { dig: I.shovel, code: I.code, crystals: I.crystal, mistake: I.bug, pass: I.ball, race: I.bolt, check: I.check, lock: I.lock, home: I.home };

  function gl(on) { const c = document.getElementById('gl'); if (c) c.style.visibility = on ? 'visible' : 'hidden'; document.body.classList.toggle('flat', !on); }
  App.gl = gl;
  function hub() {
    if (!App.hubScene || App.hubScene.seed !== App.ST.seed) {
      if (App.hubScene) { App.hubScene.keep = false; App.hubScene.dispose(); }
      App.hubScene = Hub3D.create({ isl: App.ISL, seed: App.ST.seed, onPoi: (r, k) => App.tapPoi(r, k), onGate: r => App.tapGate(r), onBase: () => App.go('base') });
      App.hubScene.keep = true; App.hubScene.seed = App.ST.seed;
    }
    return App.hubScene;
  }
  function hubState() {
    const ST = App.ST;
    return {
      open: App.regionOpen, done: App.poiDone, complete: App.regionComplete, gate: App.gateReady,
      avail: f => f === 'code' || App.famOpen(f), icon: k => ICONS[k] || I.star, built: ST.build,
      buddy: ST.active ? { sp: ST.active, cfg: ST.dinos[ST.active] } : null, at: ST.at
    };
  }

  /* ---------- title ---------- */
  App.screens.home = function () {
    if (!App.has3D) return App.renderHome2D();
    const ST = App.ST, sc = hub();
    gl(true); D3.show(sc); sc.refresh(hubState()); D3.clearLabels(); sc.labels = [];
    sc.orbit.setAuto(0.07); sc.orbit.flyTo(sc.orbit.st.target.clone(), 82, sc.orbit.st.theta, 1.0);

    const seed = ST.seed + '|factory|' + ST.missions + '|' + App.S.nonce;
    const it = F.generate(seed, d, kind);
    const m = { fam: 'factory', kind, d, seed, item: it, origin: opt.origin || { type: 'base' }, t0: App.now(), hint: 0, attempts: 1, rapid: 0, explain: false, done: false, taps: [], placed: {}, tool: null, sel: null, running: false };
    m.tool = Object.keys(it.inv)[0];
    App.go('mission'); App.S.m = m; App.gl(true);
    const sc = factoryScene(it); m.sc = sc;
    sc.scene.add(sc.tiles); sc.scene.add(sc.items);
    sc.update = (dt, t) => upd(m, dt, t); sc.dispose = () => D3.disposeTree(sc.scene);
    D3.show(sc);
    const portrait = window.innerWidth < window.innerHeight, span = Math.max(it.w, it.h * 1.3);
    sc.orbit = D3.orbit(sc.camera, document.getElementById('gl'), { target: new THREE.Vector3(portrait ? 0 : span * 0.38, 0, portrait ? span * 0.45 : 0.4), dist: span * (portrait ? 2.1 : 1.65) + 3, phi: 0.75, theta: 0, minPhi: 0.3, maxPhi: 1.2, minDist: 5, maxDist: 40, onTap: (x, y) => tapCell(m, x, y) });
    sc.onResize = () => { };
    buildTiles(m);
    render(m);
    App.bubble('Φτιάξε τη γραμμή παραγωγής! ' + goalText(it).join(' '), 'bip');
  };
  function buildTiles(m) {
    const it = m.item, sc = m.sc;
    while (sc.tiles.children.length) sc.tiles.remove(sc.tiles.children[0]);
    D3.clearLabels(); sc.labels = [];
    const all = Object.assign({}, it.puzzle.tiles, m.placed);
    for (const k in all) {
      const t = all[k], [x, y] = k.split(',').map(Number), o = tileObj(sc, t);
      o.position.copy(wp(it, x, y)); if (t.d != null && t.t !== 'bin') o.rotation.y = ROT[t.d];
      if (m.placed[k]) o.userData.mine = true;
      sc.tiles.add(o); sc.objs[k] = o;
      if (t.t === 'bin') { const el = document.createElement('div'); el.className = 'lab3d binl'; el.dataset.k = k; el.textContent = t.id; D3.addLabel(sc, el, o, 1.1); }
      if (t.t === 'press' || t.t === 'count') { const el = document.createElement('div'); el.className = 'lab3d binl small'; el.dataset.k = k; el.textContent = t.t === 'count' ? '0/' + t.n : '0/10'; D3.addLabel(sc, el, o, 1.2); }
      if (m.sel === k) { const ring = D3.mesh(D3.G.tor(0.55, 0.05), D3.glow('#ff3d9a', 1.3), [0, 0.06, 0], [Math.PI / 2, 0, 0]); o.add(ring); }
    }
  }
  function used(m, kind) { return Object.values(m.placed).filter(t => t.t === kind).length; }
  function render(m) {
    const it = m.item;
    const sel = m.sel && m.placed[m.sel];
    $('#app').innerHTML = `<div class="screen s3d fac3d">${App.barHTML('Εργοστάσιο', true)}
      <div class="c3d"><div class="c3d-left">${App.talkHTML('', 'bip')}
        <div class="runbar"><button class="btn go" id="run">${I.play}<span>ΞΕΚΙΝΑ</span></button><button class="btn sq" id="stop" aria-label="Σταμάτα">${I.stop}</button></div>
        <div class="row helpbar"><button class="btn yl" id="hintb">${I.bulb}<span>Βοήθεια</span></button><button class="btn sm" id="skipb">Άλλο</button></div>
      </div><div class="c3d-ed panel facpanel">
        <div class="lbl">Παραγγελία</div><ul class="goal">${goalText(it).map(l => `<li>${App.esc(l)}</li>`).join('')}</ul>
        <div class="lbl">Κομμάτια (πάτα ένα, μετά πάτα στο πλέγμα)</div>
        <div class="row inv">${Object.keys(it.inv).map(k => `<button class="pill ${m.tool === k ? 'on' : ''}" data-tool="${k}">${PIECE_EL[k]} <b>${it.inv[k] - used(m, k)}</b></button>`).join('')}<button class="pill ${m.tool === 'trash' ? 'on' : ''}" data-tool="trash">${I.trash}</button></div>
        <p class="small">Πάτα ξανά ένα κομμάτι σου για να το γυρίσεις.</p>
        ${sel && sel.t === 'sort' ? `<div class="lbl">Ταξινομητής: ποιο χρώμα στρίβει;</div><div class="row">${['b', 'r', 'y'].map(c => `<button class="sw ${sel.c === c ? 'on' : ''}" data-col="${c}" style="background:${COL[c]}" aria-label="${COL_EL[c]}"></button>`).join('')}<button class="pill ${sel.side === 'L' ? 'on' : ''}" data-side="L">← αριστερά</button><button class="pill ${sel.side === 'R' ? 'on' : ''}" data-side="R">δεξιά →</button></div>` : ''}
        ${sel && sel.t === 'count' ? `<div class="lbl">Μετρητής: πόσα περνάνε ευθεία;</div><div class="row"><button class="tb" data-cn="-1">−</button><span class="tn">${sel.n}</span><button class="tb" data-cn="1">+</button><button class="pill ${sel.side === 'L' ? 'on' : ''}" data-side="L">μετά ← </button><button class="pill ${sel.side === 'R' ? 'on' : ''}" data-side="R">μετά →</button></div>` : ''}
        <div id="status" class="small"></div>
      </div></div></div>`;
    App.wireSay();
    $('#back').onclick = () => { m.running = false; App.go('base'); };
    $$('[data-tool]').forEach(b => b.onclick = () => { m.tool = b.dataset.tool; render(m); });
    $$('[data-col]').forEach(b => b.onclick = () => { m.placed[m.sel].c = b.dataset.col; buildTiles(m); render(m); });
    $$('[data-side]').forEach(b => b.onclick = () => { m.placed[m.sel].side = b.dataset.side; buildTiles(m); render(m); });
    $$('[data-cn]').forEach(b => b.onclick = () => { const t = m.placed[m.sel]; t.n = Math.max(1, Math.min(9, t.n + +b.dataset.cn)); render(m); buildTiles(m); });
    $('#run').onclick = () => run(m);
    $('#stop').onclick = () => { m.running = false; clearItems(m); };
    $('#hintb').onclick = () => hint(m);
    $('#skipb').onclick = () => { m.running = false; App._finish(m, false, { err: ['skipped'], skipped: true }); };
  }
  function cellAt(m, x, y) {
    const it = m.item, gp = D3.groundPoint(m.sc.camera, x, y, 0.15); if (!gp) return null;
    const cx = Math.round(gp.x + (it.w - 1) / 2), cy = Math.round(gp.z + (it.h - 1) / 2);
    return cx >= 0 && cy >= 0 && cx < it.w && cy < it.h ? cx + ',' + cy : null;
  }
  function tapCell(m, x, y) {
    if (m.running || m.done) return;
    const k = cellAt(m, x, y); if (!k) return;
    const it = m.item;
    if (it.puzzle.tiles[k]) { App.bubble('Αυτό το κομμάτι είναι μόνιμο.'); return; }
    if (m.placed[k]) {
      if (m.tool === 'trash') { delete m.placed[k]; m.sel = null; }
      else if (m.sel === k) m.placed[k].d = (m.placed[k].d + 1) % 4;
      else m.sel = k;
      App.sfx.tap(); buildTiles(m); render(m); return;
    }
    if (!m.tool || m.tool === 'trash') return;
    if (used(m, m.tool) >= it.inv[m.tool]) { App.bubble(`Δεν έχεις άλλο: ${PIECE_EL[m.tool]}.`); App.sfx.no(); return; }
    const t = { t: m.tool, d: m.lastDir == null ? 1 : m.lastDir };
    if (t.t === 'sort') { t.c = 'b'; t.side = 'L'; }
    if (t.t === 'count') { t.n = 3; t.side = 'L'; }
    m.placed[k] = t; m.sel = k; App.sfx.tap();
    buildTiles(m); render(m);
  }
  function clearItems(m) { while (m.sc.items.children.length) m.sc.items.remove(m.sc.items.children[0]); m.itemObjs = {}; }
  function run(m) {
    if (m.running || m.done) return;
    clearItems(m);
    m.sim = F.newSim(F.compose(m.item, m.placed)); m.running = true; m.acc = 0; m.prev = {}; m.itemObjs = {};
    Object.values(m.placed).forEach(t => { if (t.d != null) m.lastDir = t.d; });
    App.bubble('Η γραμμή ξεκινάει!');
  }
  function upd(m, dt, t) {
    const sc = m.sc; if (!sc) return;
    sc.tex.offset.y = (sc.tex.offset.y - dt * 1.2) % 1;
    if (sc.orbit) sc.orbit.update(dt);
    if (m.running) {
      m.acc += dt * (m.fast ? 6 : 1);
      const TICK = 0.22;
      while (m.acc >= TICK && m.running) {
        m.acc -= TICK;
        m.prev = {}; m.sim.items.forEach(i => { m.prev[i.id] = { x: i.x, y: i.y }; });
        F.stepSim(m.sim);
        if (m.sim.fail || m.sim.done || m.sim.t >= m.item.maxT) { end(m); break; }
      }
      const k = Math.min(1, m.acc / 0.22);
      const seen = new Set();
      m.sim.items.forEach(i => {
        seen.add(i.id);
        let o = m.itemObjs[i.id]; if (!o) { o = itemObj(i); sc.items.add(o); m.itemObjs[i.id] = o; }
        const p = m.prev[i.id] || i, a = wp(m.item, p.x, p.y), b = wp(m.item, i.x, i.y);
        o.position.lerpVectors(a, b, k); o.rotation.y += dt * 2;
      });
      for (const id in m.itemObjs) if (!seen.has(+id)) { const o = m.itemObjs[id]; sc.fx.burst(o.position.clone().add(new THREE.Vector3(0, 0.4, 0)), ['#ffffff', '#ffd21f'], 6, { up: 2, speed: 1, life: 0.4 }); sc.items.remove(o); delete m.itemObjs[id]; }
      // labels: bins and presses
      document.querySelectorAll('.binl').forEach(el => {
        const tl = m.sim.tiles[el.dataset.k]; if (!tl) return;
        if (tl.t === 'bin') { const want = Object.entries(tl.want || {}); el.textContent = tl.id + (want.length && !tl.trash ? ' ' + want.map(([w, n]) => (tl.got[w] || 0) + '/' + n).join(' ') : ''); }
        if (tl.t === 'press') { const n = Math.max(0, ...Object.values(tl.buf || { x: 0 })); el.textContent = n + '/10'; }
        if (tl.t === 'count') el.textContent = Math.min(tl.passed, tl.n) + '/' + tl.n;
      });
    }
    sc.tiles.children.forEach(o => { if (o.userData.piston) o.userData.piston.position.y = 0.75 + Math.abs(Math.sin(t * 6)) * 0.12 * (m.running ? 1 : 0); });
    sc.fx.update(dt);
  }
  function end(m) {
    m.running = false;
    const s = m.sim;
    if (s.done && !s.fail) {
      App.sfx.ok(); sc_burst(m);
      App.bubble('Η παραγγελία είναι έτοιμη! Τέλεια γραμμή παραγωγής!');
      m.explain = m.attempts <= 2 && m.hint < 3;
      setTimeout(() => App._finish(m, true), 1300);
      return;
    }
    m.attempts++; App.sfx.no();
    const why = s.fail ? (s.fail.reason === 'wrong' ? `Λάθος κρύσταλλος μπήκε στον κάδο ${s.fail.bin}!` : `Πάρα πολλοί στον κάδο ${s.fail.bin}!`) : 'Δεν έφτασαν όλοι οι κρύσταλλοι στους κάδους. Μήπως κάπου σταματάνε;';
    App.bubble(why + (m.attempts >= 3 && m.hint < 5 ? ' Πάτα τη λάμπα για βοήθεια.' : ''));
    (m.errs = m.errs || []).push(s.fail ? 'factory_' + s.fail.reason : 'factory_stuck');
    if (m.attempts >= 3) $('#hintb') && $('#hintb').classList.add('pulse');
  }
  function sc_burst(m) { m.sc.fx.burst(new THREE.Vector3(0, 2, 0), ['#ffd21f', '#3fa9ff', '#e8292c', '#7dffbc'], 90, { up: 6, speed: 4, life: 1.6 }); }
  function hint(m) {
    if (m.running || m.done) return;
    m.hint = Math.min(5, m.hint + 1);
    const it = m.item, refKeys = Object.keys(it.ref.tiles).filter(k => !it.puzzle.tiles[k]);
    const TXT = ['Ακολούθησε με το δάχτυλο τον δρόμο από το ορυχείο ως τον κάδο. Πού λείπει κομμάτι;',
      it.type === 'sort' || it.type === 'combo' ? 'Ο ταξινομητής στέλνει ΕΝΑ χρώμα στο πλάι και τα άλλα ευθεία. Ποιο χρώμα πρέπει να στρίψει;' : it.type === 'press' ? 'Η πρέσα θέλει 10 θραύσματα για να φτιάξει 1 ράβδο. Οδήγησε τα θραύσματα μέσα της.' : it.type === 'count' ? 'Ο μετρητής αφήνει να περάσουν ευθεία τόσα όσα του πεις, και μετά στέλνει τα υπόλοιπα στο πλάι.' : 'Κάθε ιμάντας σπρώχνει προς το βέλος του. Πάτα έναν ιμάντα για να τον γυρίσεις.',
      'Έβαλα μερικά κομμάτια στη θέση τους.', 'Έβαλα σχεδόν όλα τα κομμάτια.', 'Να ολόκληρη η γραμμή. Πάτα ΞΕΚΙΝΑ!'];
    App.bubble(TXT[m.hint - 1]); App.sfx.tap();
    if (m.hint >= 3) {
      const n = m.hint === 3 ? Math.ceil(refKeys.length / 2) : m.hint === 4 ? Math.max(1, refKeys.length - 1) : refKeys.length;
      m.placed = {}; refKeys.slice(0, n).forEach(k => { m.placed[k] = Object.assign({}, it.ref.tiles[k]); delete m.placed[k].fixed; });
      buildTiles(m); render(m); App.bubble(TXT[m.hint - 1]);
    }
  }
  App.factoryAutoSolve = () => { const m = App.S.m; if (!m || m.fam !== 'factory') return; const it = m.item; m.placed = {}; Object.keys(it.ref.tiles).filter(k => !it.puzzle.tiles[k]).forEach(k => { m.placed[k] = Object.assign({}, it.ref.tiles[k]); }); buildTiles(m); run(m); m.fast = true; };
})();

  if (!App.has3D) document.body.classList.add('flat');
  App.setIsland();
  if (App.ST.reduce) document.documentElement.classList.add('reduce');
  try { if ('speechSynthesis' in window) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => App.findVoice(); } } catch (e) { }

  App.cloudInit();
