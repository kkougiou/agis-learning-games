<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DINOBOTS</title>
<meta name="theme-color" content="#1b5e8c">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="description" content="DINOBOTS: ο ΜΠΙΠ, ρομπότ-δεινόσαυροι και ένα 3D νησί γεμάτο γρίφους προγραμματισμού, αγώνες και εργοστάσια.">
<link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet">
<style>
/* DINOBOTS — comic island. Layout: one-screen app; map/board left, ΜΠΙΠ's suggestions right (stacked on portrait). */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --sea:#2bb3d6;--sea2:#1d7fc4;--foam:rgba(255,255,255,.55);
  --sand:#f6d58b;--jungle:#46b06a;--lava:#ff6a2b;--rock:#8d8aa6;
  --paper:#fff8ea;--cell:#f1e6cc;--ink:#1d1530;--muted:#5d5574;--line:#1d1530;--shade:#1d1530;--veil:rgba(20,16,48,.82);
  --yellow:#ffd21f;--red:#e8292c;--blue:#1f5fe0;--green:#17b26a;--orange:#ff8a1f;--purple:#8b3fe0;--cyan:#7fe9ff;--pink:#ff3d9a;
  --reach:rgba(232,41,44,.28);--good:#17b26a;--bad:#e8292c;
  --font:"Play","Trebuchet MS","Segoe UI",Roboto,Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sea:#0f3b66;--sea2:#0a2547;--foam:rgba(127,233,255,.25);--sand:#c9a660;--jungle:#2c7a47;--rock:#5c5a78;
  --paper:#242a4e;--cell:#303866;--ink:#f2f4ff;--muted:#b4b8dc;--shade:#05040f;--veil:rgba(5,4,15,.88);--reach:rgba(255,80,80,.32);color-scheme:dark}}
:root[data-theme="dark"]{
  --sea:#0f3b66;--sea2:#0a2547;--foam:rgba(127,233,255,.25);--sand:#c9a660;--jungle:#2c7a47;--rock:#5c5a78;
  --paper:#242a4e;--cell:#303866;--ink:#f2f4ff;--muted:#b4b8dc;--shade:#05040f;--veil:rgba(5,4,15,.88);--reach:rgba(255,80,80,.32);color-scheme:dark}
html{height:100%}
body{height:100%;margin:0;overflow:hidden;background:var(--sea2);color:var(--ink);font-family:var(--font);font-weight:700;font-size:18px;line-height:1.3;
  background-image:radial-gradient(circle at 20% 10%,var(--sea) 0,var(--sea2) 70%);user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;margin:0;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
h1,h2,h3,p{margin:0}
#app{height:100%;display:flex;flex-direction:column;position:relative}
.screen{flex:1;min-height:0;width:100%;max-width:1280px;margin:0 auto;padding-block:8px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px;overflow-y:auto;overflow-x:hidden}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;display:block}
.ic.fill{fill:currentColor;stroke:none}
.ar-D{transform:rotate(90deg)}.ar-L{transform:rotate(180deg)}.ar-U{transform:rotate(-90deg)}
.star{width:1em;height:1em;display:block;fill:var(--yellow);stroke:var(--line);stroke-width:1.6;stroke-linejoin:round}
.star.off{fill:rgba(128,128,150,.35)}
.dino{display:block;width:100%;height:auto;overflow:visible}
.dhead{display:block;width:100%;height:100%}
.robot{display:block;width:100%;height:100%;overflow:visible}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;min-height:52px;padding:.45em 1.1em;border:3px solid var(--line);border-radius:16px;background:var(--paper);color:var(--ink);font-weight:900;box-shadow:0 5px 0 var(--shade);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shade)}
.btn.go{background:var(--green);color:#fff;font-size:1.35rem;letter-spacing:.04em;min-height:58px}
.btn.yl{background:var(--yellow);color:#1d1530}
.btn.rd{background:var(--red);color:#fff}
.btn.bl{background:var(--blue);color:#fff}
.btn.sq{width:52px;padding:0;font-size:1.45rem;flex:none}
.btn.sm{min-height:44px;font-size:.95rem;padding:.3em .8em;border-radius:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sel{background:var(--yellow);color:#1d1530}
.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;flex:none;flex-wrap:wrap}
.bar .ttl{flex:1;min-width:0;font-weight:900;font-size:1.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;text-shadow:2px 2px 0 var(--shade)}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:1.05rem;padding:5px 12px;background:var(--paper);border:3px solid var(--line);border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .star{width:1.15em;height:1.15em}
.chip .pc{height:1.2em;width:auto}
.chip .pc-r{height:1.5em}

/* speech */
.talk{display:flex;align-items:center;gap:12px;flex:none;min-width:0}
.talk .face{flex:none;width:56px;height:70px}
.bubble{position:relative;flex:1;min-width:0;background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:8px 12px;line-height:1.28;min-height:54px;display:flex;align-items:center;gap:8px}
.bubble .txt{flex:1;min-width:0}
.bubble::before{content:"";position:absolute;left:-13px;top:50%;margin-top:-9px;border:9px solid transparent;border-left:0;border-right:11px solid var(--line)}
.bubble::after{content:"";position:absolute;left:-8px;top:50%;margin-top:-6px;border:6px solid transparent;border-left:0;border-right:8px solid var(--paper)}
.bubble .say{flex:none;width:40px;height:40px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;font-size:1.2rem;background:var(--yellow);color:#1d1530}
.flash{animation:flash .4s}
@keyframes flash{30%{transform:scale(1.03)}}

/* home */
.home{align-items:center;justify-content:center;gap:14px;text-align:center}
.logo{font-weight:900;font-size:clamp(3.4rem,13vw,7.5rem);line-height:.9;color:var(--yellow);-webkit-text-stroke:4px var(--line);paint-order:stroke fill;text-shadow:6px 6px 0 var(--shade);transform:rotate(-4deg) skewX(-6deg);letter-spacing:.02em}
.tag{font-weight:900;font-size:clamp(1rem,3.6vw,1.4rem);background:var(--paper);border:3px solid var(--line);border-radius:12px;padding:4px 14px;transform:rotate(2deg)}
.hero{display:flex;align-items:flex-end;justify-content:center;gap:8px;width:min(680px,100%)}
.hero .bipw{width:min(130px,24vw)}
.hero .dw{width:min(300px,52vw)}
.homebtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.corner{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.note{font-size:.85rem;color:#fff;opacity:.9;max-width:44ch}

/* map */
.mapwrap{flex:1;min-height:0;display:grid;grid-template-columns:1fr 300px;gap:12px}
.mapbox{position:relative;min-height:0;border:3px solid var(--line);border-radius:22px;overflow:hidden;background:var(--sea);box-shadow:0 6px 0 var(--shade)}
.mapbox svg.island{position:absolute;inset:0;width:100%;height:100%}
.region{cursor:pointer}
.region .badge{transition:transform .15s}
.region:active .badge{transform:scale(.95)}
.poi{cursor:pointer}
.side{display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto}
.side h3{color:#fff;text-shadow:2px 2px 0 var(--shade);font-size:1.05rem}
.card{display:flex;align-items:center;gap:10px;padding:10px 12px;border:3px solid var(--line);border-radius:16px;background:var(--paper);box-shadow:0 4px 0 var(--shade);text-align:left;min-height:64px}
.card .ico{flex:none;width:44px;height:44px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;font-size:1.5rem;background:var(--yellow);color:#1d1530}
.card .t{font-weight:900;line-height:1.15}
.card .s{font-size:.82rem;color:var(--muted);font-weight:700}
.card .kb{display:inline-block;font-size:.72rem;padding:1px 7px;border-radius:999px;background:var(--purple);color:#fff;margin-left:4px;vertical-align:middle}
.card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shade)}
.fam-dig .ico{background:#e2b86a}.fam-code .ico{background:var(--cyan)}.fam-crystals .ico{background:#a46bff;color:#fff}
.fam-mistake .ico{background:#c27a4c;color:#fff}.fam-bones .ico{background:#f3ead2}.fam-ramp .ico{background:#7dffbc}
.fam-pass .ico,.fam-race .ico,.fam-penalty .ico{background:#2c9a52;color:#fff}.fam-decorate .ico{background:var(--pink);color:#fff}.fam-museum .ico{background:#d5dbea}

/* base */
.basegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.bld{display:flex;flex-direction:column;gap:6px;padding:12px;border:3px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:0 5px 0 var(--shade);text-align:left;min-height:150px}
.bld .bt{font-weight:900;font-size:1.15rem}
.bld .bs{font-size:.88rem;color:var(--muted)}
.bld.locked{opacity:.85;background:var(--cell)}
.bld .art{height:70px;display:flex;align-items:flex-end;gap:6px}
.bld .art .dw{width:110px}

/* mission frame */
.stage{flex:1;min-height:0;display:flex;gap:12px;align-items:stretch}
.boardcol{flex:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.ctl{flex:none;width:300px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto}
.panel{background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 4px 0 var(--shade)}
.lbl{font-size:.85rem;color:var(--muted);font-weight:900;letter-spacing:.04em;text-transform:uppercase}

/* grid boards */
.grid{display:grid;gap:3px;background:var(--line);border:3px solid var(--line);border-radius:14px;padding:3px;touch-action:none;position:relative}
.cellb{position:relative;aspect-ratio:1;border-radius:7px;background:var(--sand);display:grid;place-items:center;font-weight:900;font-size:clamp(.9rem,3.2vmin,1.6rem)}
.cellb.dug{background:#c99a52}
.cellb.dim{filter:brightness(.55) saturate(.4)}
.cellb.ring{box-shadow:inset 0 0 0 4px var(--cyan)}
.cellb.hot{box-shadow:inset 0 0 0 4px var(--yellow)}
.stone{width:78%;height:78%;border-radius:40%;background:var(--rock);border:3px solid var(--line);display:grid;place-items:center;color:#fff;text-shadow:1px 1px 0 var(--line);font-size:1.15em}
.stone.new{background:#a9a6c4;color:var(--ink);text-shadow:none}
.bonefound{width:86%}
.battery{display:flex;gap:4px}
.battery i{width:18px;height:26px;border:2px solid var(--line);border-radius:4px;background:var(--green)}
.battery i.off{background:transparent}

/* code */
.cellb.t-R{background:var(--rock)}
.cellb.t-W{background:#3fa9ff;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.25) 0 6px,transparent 6px 14px)}
.cellb.t-dot::after{content:"";width:22%;height:22%;border-radius:50%;background:var(--purple);opacity:.85}
.cellb.t-pick{box-shadow:inset 0 0 0 4px var(--pink)}
.cellb.t-end{box-shadow:inset 0 0 0 5px var(--green)}
.gem{width:62%;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.gem.got{opacity:.2}
.mover{position:absolute;pointer-events:none;transition:left .26s linear,top .26s linear;z-index:2;display:grid;place-items:center}
.mover .dhead{width:88%;height:88%;border-radius:50%;background:#fff;border:3px solid var(--line)}
.mover.bump{animation:shake .3s}
.prog{display:flex;flex-wrap:wrap;gap:6px;min-height:60px;align-content:flex-start}
.blk{position:relative;width:56px;height:56px;border:3px solid var(--line);border-radius:12px;background:var(--cyan);color:#1d1530;display:grid;place-items:center;font-size:1.5rem;box-shadow:0 3px 0 var(--shade)}
.blk.jp{background:#7dffbc}
.blk .hop{position:absolute;left:-7px;top:-7px;width:24px;height:24px;border-radius:50%;background:#7dffbc;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem}
.blk.slot{background:transparent;border-style:dashed;box-shadow:none;opacity:.5}
.blk .n{position:absolute;right:-6px;bottom:-6px;min-width:24px;height:24px;border-radius:999px;background:var(--yellow);border:2px solid var(--line);font-size:.85rem;display:grid;place-items:center;padding:0 4px}
.blk.on{outline:4px solid var(--pink);outline-offset:2px}
.blk.run{background:var(--yellow)}
.blk.badblk{background:#ffb3b3}
.palette{display:flex;flex-wrap:wrap;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* bones */
.bboard{position:relative;touch-action:none}
.bboard .ghostdino{position:absolute;inset:0;opacity:.18;pointer-events:none;display:flex;align-items:center;justify-content:center}
.tray{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;min-height:90px;touch-action:none}
.piece{display:inline-grid;gap:2px;padding:4px;border-radius:10px;cursor:grab;touch-action:none}
.piece.sel{outline:4px solid var(--pink);background:rgba(255,61,154,.12)}
.piece i{width:var(--u,26px);height:var(--u,26px);border-radius:6px;background:#f3ead2;border:2px solid var(--line);display:block}
.piece i.e{visibility:hidden}
.drag{position:fixed;z-index:50;pointer-events:none;opacity:.85}

/* crystals */
.shop{display:grid;grid-template-columns:1fr;gap:10px;width:100%;max-width:820px}
.bigx{font-size:clamp(2.2rem,8vmin,3.6rem);font-weight:900;text-align:center;font-variant-numeric:tabular-nums}
.bigx .tn{color:var(--blue)}.bigx .on{color:#c99000}
.bank,.basket{min-height:120px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px;padding:10px;border:3px dashed var(--line);border-radius:16px;background:var(--cell)}
.basket{border-style:solid;background:var(--paper)}
.basket.locked .pc{opacity:.6}
.pcb{display:inline-flex;align-items:flex-end;padding:2px;border-radius:8px}
.pcb .pc-s{width:22px}.pcb .pc-r{width:24px}.pcb .pc-p{width:84px}
.pcb.sel{outline:3px solid var(--pink)}
.press{display:flex;align-items:center;gap:8px}
.slotguide{display:inline-flex;gap:4px;opacity:.45}

/* mistake */
.steps{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.step{min-width:64px;min-height:64px;padding:8px 14px;border:3px solid var(--line);border-radius:14px;background:var(--paper);font-size:clamp(1.2rem,4vmin,1.9rem);font-weight:900;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 4px 0 var(--shade);font-variant-numeric:tabular-nums}
.steps.col{flex-direction:column;align-items:stretch}
.steps.col .step{justify-content:flex-start}
.step.ok{background:#c9f5dd}.step.bad{background:#ffc9c9}.step.hl{outline:4px solid var(--yellow)}
.step .pcs{display:flex;align-items:flex-end;gap:3px}
.step .pcs .pc-r{width:16px}.step .pcs .pc-s{width:14px}
.choices{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

/* ramps */
.lab svg{width:100%;height:auto;display:block}
.zone{cursor:pointer}

/* pitch */
.pitch{position:relative;width:100%;max-width:820px;aspect-ratio:8/5;border:3px solid var(--line);border-radius:16px;overflow:hidden;background:#2c9a52;touch-action:none}
.pitch .lines{position:absolute;inset:0;width:100%;height:100%}
.tok{position:absolute;width:12.5%;height:20%;display:grid;place-items:center;transition:left .45s ease,top .45s ease;z-index:2}
.tok .disc{width:82%;aspect-ratio:1;border-radius:50%;border:3px solid var(--line);background:#fff;overflow:hidden;display:grid;place-items:center}
.tok.mate .disc{background:#fff8ea}
.tok.foe .disc{background:#c27a4c}
.tok.pick .disc{outline:5px solid var(--yellow)}
.tok .spd{position:absolute;right:2%;bottom:2%;font-size:.8rem;background:var(--yellow);border:2px solid var(--line);border-radius:999px;padding:0 5px;display:flex;align-items:center;gap:1px;color:#1d1530}
.tok .lab2{position:absolute;left:0;right:0;top:-2px;text-align:center;font-size:.85rem;color:#fff;text-shadow:1px 1px 0 var(--line)}
.ballk{position:absolute;width:6%;aspect-ratio:1;border-radius:50%;background:#fff;border:3px solid var(--line);z-index:3;transition:left .45s ease,top .45s ease;transform:translate(-50%,-50%)}
.score{display:flex;align-items:center;gap:12px;font-size:1.5rem;font-weight:900;color:#fff;text-shadow:2px 2px 0 var(--shade)}
.goalbox{position:relative;width:100%;max-width:640px;aspect-ratio:2/1;border:4px solid #fff;border-bottom:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 2px,transparent 2px 18px),repeating-linear-gradient(0deg,rgba(255,255,255,.18) 0 2px,transparent 2px 18px),#2c9a52;touch-action:none}
.keeper{position:absolute;bottom:0;width:22%;height:70%;transition:left .05s linear}
.shotball{position:absolute;width:9%;aspect-ratio:1;border-radius:50%;background:#fff;border:3px solid var(--line);transition:all .55s ease-out}

/* overlays */
.ov{position:absolute;inset:0;z-index:40;background:var(--veil);display:flex;align-items:center;justify-content:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dlg{background:var(--paper);border:4px solid var(--line);border-radius:22px;padding:18px;max-width:720px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;box-shadow:0 8px 0 var(--shade)}
.dlg h2{font-size:1.6rem}
.stars3{display:flex;gap:6px;font-size:3rem}
.stars3 .star{animation:pop .5s backwards}
.stars3 .star:nth-child(2){animation-delay:.15s}.stars3 .star:nth-child(3){animation-delay:.3s}.stars3 .star:nth-child(4){animation-delay:.45s}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.comic{max-width:860px}
.comic .scene{width:100%;height:auto;border:3px solid var(--line);border-radius:14px;display:block;aspect-ratio:16/9}
.figwrap{width:100%;height:100%}
.comic .cap{display:flex;gap:10px;align-items:center;text-align:left;width:100%}
.comic .cap .face{flex:none;width:60px;height:74px}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--muted);opacity:.4}.dots i.on{opacity:1;background:var(--yellow);border:2px solid var(--line)}

/* workshop / museum */
.ws{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;flex:1;min-height:0}
.ws .preview{display:flex;align-items:center;justify-content:center;background:var(--paper);border:3px solid var(--line);border-radius:20px;padding:10px}
.opts{display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:0}
.sw{width:48px;height:48px;border-radius:12px;border:3px solid var(--line);position:relative;display:grid;place-items:center;font-size:.8rem}
.sw.on{outline:4px solid var(--pink);outline-offset:2px}
.sw.lock{opacity:.5}
.sw .lk{position:absolute;inset:auto -6px -8px auto;background:var(--paper);border:2px solid var(--line);border-radius:999px;font-size:.7rem;padding:0 4px;display:flex;align-items:center;gap:1px}
.pill{min-height:44px;padding:0 12px;border:3px solid var(--line);border-radius:12px;background:var(--paper);font-weight:900}
.pill.on{background:var(--yellow);color:#1d1530}
.mus{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mcard{background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 5px 0 var(--shade)}
.mcard ul{margin:0;padding-left:1.1em;font-size:.95rem;line-height:1.35;display:flex;flex-direction:column;gap:4px}
.mcard.unk .dino{filter:brightness(0) opacity(.25)}

/* parent */
.parent{background:var(--paper);color:var(--ink);border-radius:18px;border:3px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:14px;font-weight:500;font-size:.95rem}
.parent h2{font-size:1.3rem}.parent h3{font-size:1.05rem;margin-top:4px}

<script>
/* ---- engine/agis-engine.js ---- */
/* Agis Adaptive Learning Engine
 * Shared by DINOBOTS (first consumer), ΜΠΙΠ v1.2 and later LEXIS.
 * Spec: 00_MASTER_PLAN/ADAPTIVE_LEARNING_ARCHITECTURE.md
 *
 * Rules kept in this file:
 * - pure and deterministic: every function that depends on time takes `now` (ms) as an argument,
 *   every random choice takes a seed; there is no Math.random() and no Date.now() in here;
 * - knows nothing about grids, numbers or dinosaurs: a game describes its task families in a catalog;
 * - independent and assisted success are kept apart;
 * - logs are bounded; corrupt state is repaired, never thrown.
 */
(function (root) {
  'use strict';

  const VERSION = '1.1.0';
  const SCHEMA = 1;
  const DAY = 86400000, HOUR = 3600000, MIN = 60000;

  const LIMITS = { trials: 2000, sessions: 300, pacing: 300, errs: 8, recent: 10, idays: 30, reps: 6 };

  /* ---------- skills (stable IDs, Architecture §3) ---------- */
  const SKILLS = {
    number_sense: 'math_logic', arithmetic_strategy: 'math_logic', place_value: 'math_logic',
    patterns_early_algebra: 'math_logic', geometry: 'math_logic', spatial_reasoning: 'math_logic',
    deductive_logic: 'math_logic', constraint_reasoning: 'math_logic', combinatorics: 'math_logic',
    probability_intuition: 'math_logic', problem_decomposition: 'math_logic', transfer: 'math_logic',
    error_detection: 'math_logic', mathematical_explanation: 'math_logic', metacognition: 'math_logic',
    observation: 'discovery', prediction: 'discovery', causal_reasoning: 'discovery',
    experiment_design: 'discovery', evidence_revision: 'discovery', mechanical_reasoning: 'discovery',
    systems_reasoning: 'discovery', spatial_construction: 'discovery', modelling: 'discovery',
    algorithmic_sequencing: 'computational', relative_orientation: 'computational', loops: 'computational', conditionals: 'computational',
    functions_abstraction: 'computational', variables_counters: 'computational', event_rules: 'computational'
  };

  /* cognitive modes used for rotation (Architecture §12) */
  const MODES = { L: 'focused logic', S: 'spatial/visual', X: 'story/exploration', C: 'creative/build', R: 'retrieval', B: 'boss', F: 'low-load free play' };

  /* scaffold ladder (Architecture §10) */
  const HINT = { NONE: 0, CUE: 1, STRATEGY: 2, PARTIAL: 3, WORKED_STEP: 4, WORKED_EXAMPLE: 5 };

  /* ---------- seeded randomness ---------- */
  function hashSeed(str) {                 // FNV-1a, 32-bit
    let h = 0x811c9dc5;
    str = String(str);
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    return h >>> 0;
  }
  function rng(seed) {                     // mulberry32: same seed, same sequence
    let a = (typeof seed === 'number' ? seed : hashSeed(seed)) >>> 0;
    const next = function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    next.int = (lo, hi) => lo + Math.floor(next() * (hi - lo + 1));
    next.pick = arr => arr[Math.floor(next() * arr.length)];
    next.shuffle = arr => { const a2 = arr.slice(); for (let i = a2.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1)); [a2[i], a2[j]] = [a2[j], a2[i]]; } return a2; };
    next.chance = p => next() < p;
    return next;
  }

  /* ---------- helpers ---------- */
  const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
  const num = (x, d) => (typeof x === 'number' && isFinite(x)) ? x : d;
  const arr = x => Array.isArray(x) ? x : [];
  const dayKey = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const push = (list, item, cap) => { list.push(item); while (list.length > cap) list.shift(); };
  const median = xs => { if (!xs.length) return 0; const s = xs.slice().sort((a, b) => a - b); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
  const mean = xs => xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : 0;

  /* ---------- state ---------- */
  function newSkill() {
    return { n: 0, ev: 0, ind: 0, ast: 0, fail: 0, flex: 0, seen: 0, lastInd: 0, due: 0, ivl: 0, hint: 0, recent: [], errs: [], reps: [], idays: [] };
  }
  function newFam() { return { lvl: 1, n: 0, hist: [], hints: [], last: 0 }; }
  function newState() {
    return { schema: SCHEMA, engine: VERSION, skills: {}, fams: {}, session: null, sessions: [], trials: [], pacing: [], seq: 0 };
  }

  /* Repairs whatever comes back from storage. Unknown or broken parts are dropped, never thrown. */
  function shapeState(s) {
    const f = newState();
    if (!s || typeof s !== 'object' || s.schema !== SCHEMA) return f;
    try {
      f.seq = num(s.seq, 0);
      for (const id in (s.skills || {})) {
        const r = s.skills[id], k = newSkill();
        if (!r || typeof r !== 'object') continue;
        for (const key of ['n', 'ev', 'ind', 'ast', 'fail', 'flex', 'seen', 'lastInd', 'due', 'ivl', 'hint']) k[key] = num(r[key], k[key]);
        k.ev = clamp(k.ev, 0, 1);
        k.recent = arr(r.recent).slice(-LIMITS.recent); k.errs = arr(r.errs).slice(-LIMITS.errs);
        k.reps = arr(r.reps).slice(-LIMITS.reps); k.idays = arr(r.idays).slice(-LIMITS.idays);
        f.skills[id] = k;
      }
      for (const id in (s.fams || {})) {
        const r = s.fams[id], k = newFam();
        if (!r || typeof r !== 'object') continue;
        k.lvl = clamp(num(r.lvl, 1), 1, 10); k.n = num(r.n, 0); k.last = num(r.last, 0);
        k.hist = arr(r.hist).slice(-6); k.hints = arr(r.hints).slice(-6);
        f.fams[id] = k;
      }
      f.trials = arr(s.trials).filter(t => t && typeof t === 'object').slice(-LIMITS.trials);
      f.sessions = arr(s.sessions).filter(t => t && typeof t === 'object').slice(-LIMITS.sessions);
      f.pacing = arr(s.pacing).filter(t => t && typeof t === 'object').slice(-LIMITS.pacing);
      if (s.session && typeof s.session === 'object' && num(s.session.t0, 0)) f.session = Object.assign(newSession(s.session.t0, s.session.id), s.session);
    } catch (e) { return newState(); }
    return f;
  }

  /* ---------- sessions ---------- */
  const SESSION_GAP = 30 * MIN;
  function newSession(now, id) { return { id: id || ('s' + now.toString(36)), t0: now, last: now, n: 0, modes: {}, fams: {}, lowLoadAt: 0, phaseLog: [] }; }
  function touchSession(st, now) {
    if (!st.session || now - st.session.last > SESSION_GAP) {
      if (st.session) closeSession(st);
      st.session = newSession(now);
    }
    st.session.last = now;
    return st.session;
  }
  function closeSession(st) {
    const s = st.session; if (!s) return;
    push(st.sessions, { id: s.id, t0: s.t0, ms: s.last - s.t0, n: s.n, modes: s.modes, fams: s.fams, lowLoad: s.lowLoadAt ? 1 : 0 }, LIMITS.sessions);
    st.session = null;
  }

  /* Where in the 30–45 minute core-session template we are (Architecture §12). */
  function sessionPhase(st, now) {
    const s = st.session;
    if (!s || now - s.last > SESSION_GAP) return 'warmup';
    const m = (now - s.t0) / MIN;
    if (s.n < 2 || m < 6) return 'warmup';
    if (m < 24) return 'focus';
    if (m < 32) return 'variation';
    if (m < 40) return 'boss';
    if (m < 46) return 'reflect';
    return 'continue';
  }

  /* ---------- evidence ---------- */
  function outcomeOf(t) {          // 1 independent, .5 assisted, 0 not solved
    if (!t.ok) return 0;
    return (num(t.hint, 0) === 0 && num(t.attempts, 1) <= 2) ? 1 : 0.5;
  }

  function masteryOf(k) {
    if (!k || !k.n) return 0;
    const days = k.idays.length;
    let m;
    if (k.ev >= 0.8 && k.ind >= 8 && days >= 3 && k.flex >= 1) m = 4;

          case 'jump': tick(s.id); step(s.id, 'jump'); break;
          case 'left': tick(s.id); st.dir = (st.dir + 3) % 4; trace.push({ a: 'turn', dir: st.dir, x: st.x, y: st.y, id: s.id }); break;
          case 'right': tick(s.id); st.dir = (st.dir + 1) % 4; trace.push({ a: 'turn', dir: st.dir, x: st.x, y: st.y, id: s.id }); break;
          case 'dig': {
            tick(s.id);

  function countCells(map, f) { let n = 0; for (const row of map.cells) for (const c of row) if (f(c)) n++; return n; }
  function runAll(maps, prog, opts) { return maps.map(m => run(m, prog, opts)); }

  /* ---------- map helpers ---------- */
  const G0 = () => ({ k: 'g', z: 0, c: '', cr: false, f: false, m: false, fos: false });

  /* walk a relative program from a start, carving the ground it visits (used to build maps from reference programs) */

    visit();
    const walk = list => list.forEach(s => {
      if (s.op === 'fwd') for (let i = 0; i < (s.n || 1); i++) { x += DX[dir]; y += DY[dir]; visit(); }

  /* bounding box of a relative walk, to size and place maps */
  function walkCells(start, prog) {

    const walk = list => list.forEach(s => {

  function fitMap(pts, pad, fill) {

  }
  function scatterRocks(map, r, p) {

  }
  function decorate(map, r) {                 // purely visual: some rock tiles become water or higher cliffs
    for (const row of map.cells) for (const c of row) if (c.k === 'r') { const u = r(); if (u < 0.2) c.deco = 'tree'; else if (u < 0.3) c.deco = 'bush'; }
  }

  /* ---------- templates ---------- */
  const SIZES = d => Math.round(d);
  /* absolute warm-up (ΜΠΙΠ continuity): open field, rocks, 1–3 crystals; BFS for the shortest arrow program */
  function tplAbs(r, d) {
    const w = d < 3 ? 5 : d < 6 ? 6 : 7, h = d < 3 ? 4 : 5, nt = d < 4 ? 1 : d < 7 ? 2 : 3;
    for (let a = 0; a < 200; a++) {
      const map = blank(w, h);
      for (const row of map.cells) for (const c of row) if (r() < 0.12 + d * 0.012) c.k = 'r';
      const free = []; map.cells.forEach((row, y) => row.forEach((c, x) => { if (c.k === 'g') free.push([x, y]); }));
      if (free.length < nt + 2) continue;
      const pick = r.shuffle(free), s = pick[0];
      map.start = { x: s[0], y: s[1], dir: 1 };
      pick.slice(1, 1 + nt).forEach(([x, y]) => { map.cells[y][x].cr = true; });
      map.goal = { crystals: 'all' };
      const sol = bfsAbs(map);
      if (!sol || sol.length < (d < 2 ? 1 : 2) || sol.length > 3 + Math.ceil(d / 2)) continue;
      return { maps: [map], ref: { main: sol, fns: {} }, palette: ['mv'], mode: 'abs' };
    }
    return null;
  }
  function bfsAbs(map) {
    const crs = []; map.cells.forEach((row, y) => row.forEach((c, x) => { if (c.cr) crs.push([x, y]); }));
    const full = (1 << crs.length) - 1, idx = new Map(crs.map((p, i) => [p[0] + ',' + p[1], i]));
    const s0 = { x: map.start.x, y: map.start.y, m: 0, prog: [] }, key = s => s.x + ',' + s.y + ',' + s.m, seen = new Set([key(s0)]);
    let q = [s0];
    for (let depth = 0; depth < 10 && q.length; depth++) {
      const nq = [];
      for (const s of q) {
        if (s.m === full) return s.prog;
        for (const d of ['U', 'R', 'D', 'L']) {
          let x = s.x, y = s.y, m = s.m;
          for (let n = 1; n <= 7; n++) {
            const c = cellAt(map, x + DX[ABS[d]], y + DY[ABS[d]]); if (!c || c.k !== 'g') break;

            const ns = { x, y, m, prog: s.prog.concat([S.mv(d, n)]) };

  /* a random relative path: list of segment lengths and turns, self-avoiding */
  function randomPath(r, turns, minSeg, maxSeg) {
    for (let a = 0; a < 200; a++) {
      const prog = [], pts = new Set(['0,0']); let x = 0, y = 0, dir = 1, ok = true;
      for (let t = 0; t <= turns && ok; t++) {
        const n = r.int(minSeg, maxSeg);
        for (let i = 0; i < n; i++) { x += DX[dir]; y += DY[dir]; const k = x + ',' + y; if (pts.has(k)) { ok = false; break; } pts.add(k); }
        prog.push(S.fwd(n));
        if (t < turns) { const tr = r.chance(0.5) ? 'left' : 'right'; prog.push(S[tr]()); dir = tr === 'left' ? (dir + 3) % 4 : (dir + 1) % 4; }
      }
      if (ok) return prog;
    }
    return null;
  }
  function buildFromWalk(r, ref, pad, opts) {

    map.start = { x: ox, y: oy, dir: 1 };
    let i = 0;
    const end = carve(map, map.start, ref, (c, x, y) => { if (opts.onVisit) opts.onVisit(c, x, y, i++); });
    return { map, end };
  }

  function tplRel(r, d) {
    const turns = Math.min(6, 1 + Math.floor(d / 1.5)), ref0 = randomPath(r, turns, 1, d < 4 ? 3 : 4);
    if (!ref0) return null;
    const ref = { main: ref0, fns: {} };
    const { map, end } = buildFromWalk(r, ref, 1);
    map.cells[end.y][end.x].cr = true;
    // a crystal on some corners too
    walkCells({ x: map.start.x, y: map.start.y, dir: 1 }, ref).forEach(([x, y], k, arr) => { if (k > 0 && k < arr.length - 1 && r() < 0.15) map.cells[y][x].cr = true; });
    map.goal = { crystals: 'all' };
    if (d >= 5) openUp(map, r, 0.35);

  }
  function openUp(map, r, p) { for (const row of map.cells) for (const c of row) if (c.k === 'r' && r() < p) c.k = 'g'; }

  /* loops: stairs (3D), zig-zag, nested stairs; block limit forces the loop */
  function tplLoop(r, d) {
    const kind = d < 4 ? 'stairs' : d < 6 ? r.pick(['stairs', 'zigzag']) : r.pick(['nested', 'zigzag2']);

    else if (kind === 'zigzag') { const k = r.int(3, 4); main = [S.rep(k, [S.fwd(1), S.left(), S.fwd(1), S.right()])]; }
    else if (kind === 'nested') { const k = r.int(3, 4), s = r.int(2, 3); main = [S.rep(k, [S.rep(s, [S.fwd(1)]), S.jump()])]; }
    else { const k = r.int(2, 3), s = r.int(2, 3); main = [S.rep(k, [S.rep(s, [S.fwd(1)]), S.left(), S.rep(s, [S.fwd(1)]), S.right()])]; }

    const { map, end } = buildFromWalk(r, ref, 1);

  /* conditions: dig marks at different places on three islands */
  function tplCond(r, d) {
    const segs = d < 4 ? 1 : d < 7 ? 2 : 3, L = r.int(4, d < 4 ? 5 : 6);
    const main = [];
    for (let s = 0; s < segs; s++) { main.push(S.rep(L, [S.fwd(1), S.iff(cond('mark'), [S.dig()])])); if (s < segs - 1) main.push(r.chance(0.5) ? S.left() : S.right()); }

        const { map } = buildFromWalk(r, ref, 1, { onVisit: (c, x, y, i) => { if (i > 0 && r() < 0.4) { c.m = true; c.fos = true; marks.push(i); } } });

  /* condition-controlled loops: corridors of different lengths, signs, spirals */
  function tplUntil(r, d) {
    const kind = d < 4 ? 'wall' : d < 7 ? 'signs' : r.pick(['signs', 'spiral']);
    const maps = [];
    let ref;
    if (kind === 'wall') {
      const segs = d < 3 ? 1 : 2, turn = r.chance(0.5) ? 'left' : 'right';
      ref = { main: segs === 1 ? [S.until(cond('wall'), [S.fwd(1)])] : [S.until(cond('wall'), [S.fwd(1)]), S[turn](), S.until(cond('wall'), [S.fwd(1)])], fns: {} };

  /* functions: the same little route three or four times; the block limit makes a function worth it */
  function tplFunc(r, d) {
    for (let a = 0; a < 80; a++) {

        [S.fwd(1), S.left(), S.fwd(1), S.right(), S.fwd(1), S.right(), S.fwd(1), S.left()],

      const visits = walkCells(map.start, ref);
      visits.forEach(([x, y], i) => { if (i > 0 && i % (visits.length / reps | 0) === 0) map.cells[y][x].cr = true; });

  /* counters: dig under the n-th red tile */
  function tplCount(r, d) {
    const n = r.int(2, d < 7 ? 3 : 4);

    const maps = [];
    const sigs = new Set();
    for (let v = 0; v < 3; v++) {

        const reds = r.shuffle(Array.from({ length: L }, (_, i) => i + 1)).slice(0, n + r.int(1, 2)).sort((x, y) => x - y);

  const TEMPLATES = {
    code_seq: { tpl: tplAbs, primary: 'algorithmic_sequencing', skills: ['spatial_reasoning'], mode: 'L' },

  const nested = (svg, x, y, w, color) => svg.replace('<svg class="ic', `<svg x="${x}" y="${y}" width="${w}" height="${w}" style="color:${color || '#1d1530'}" class="ic`);
  function islandSVG() {
    let s = `<defs><pattern id="waves" width="60" height="30" patternUnits="userSpaceOnUse"><path d="M0 15 q15 -10 30 0 t30 0" fill="none" stroke="var(--foam)" stroke-width="2"/></pattern><clipPath id="isl"><path d="${ISL.path}"/></clipPath></defs>`;
    s += `<rect x="-200" y="-200" width="1400" height="1100" fill="var(--sea)"/><rect x="-200" y="-200" width="1400" height="1100" fill="url(#waves)"/>`;
    s += `<path d="${ISL.path}" fill="none" stroke="var(--foam)" stroke-width="26" opacity=".7"/><path d="${ISL.path}" fill="var(--sand)" stroke="#1d1530" stroke-width="4"/>`;
    s += `<g clip-path="url(#isl)">` + ISL.regions.filter(r => r.biome !== 'beach').map(r => `<circle cx="${r.x}" cy="${r.y}" r="150" fill="${A.BIOME_FILL[r.biome]}" opacity=".9"/>`).join('') + `</g>`;
    ISL.regions.forEach((r, i) => ISL.deco[i].forEach(d => { const x = r.x + d.dx, y = r.y + d.dy; s += r.biome === 'beach' ? A.palmSVG(x, y, d.s) : r.biome === 'jungle' ? A.treeSVG(x, y, d.s * 1.2) : A.volcanoSVG(x, y, d.s * 0.7); }));
    ISL.layout.edges.forEach(([a, b]) => { const A1 = ISL.regions[a], B1 = ISL.regions[b], open = regionOpen(a) && regionOpen(b); s += `<path d="M${A1.x} ${A1.y} L${B1.x} ${B1.y}" stroke="#7a4a2a" stroke-width="10" stroke-dasharray="${open ? '0' : '14 12'}" stroke-linecap="round" opacity="${open ? .85 : .5}"/>`; });
    ISL.regions.slice().sort((a, b) => regionOpen(a.id) - regionOpen(b.id)).forEach(r => {         // locked regions first, open ones drawn on top
      const open = regionOpen(r.id), ready = gateReady(r.id), done = regionComplete(r.id);
      s += `<g class="region" data-r="${r.id}">`;
      if (open) {
        r.pois.forEach((p, k) => {
          const ang = -Math.PI / 2 + (k - 1) * 1.15, px = r.x + Math.cos(ang) * 64, py = r.y + Math.sin(ang) * 64;
          const pd = poiDone(r.id, k), avail = famOpen(p.fam);
          s += `<g class="poi" data-r="${r.id}" data-k="${k}"><circle cx="${px}" cy="${py}" r="28" fill="${pd ? '#17b26a' : avail ? FAM_COL[p.fam] || '#fff' : '#cfcadb'}" stroke="#1d1530" stroke-width="4"/>${nested(pd ? I.check : avail ? FAM_ICON[p.fam] : I.lock, px - 16, py - 16, 32, pd ? '#fff' : '#1d1530')}${p.fossil && !pd && avail ? `<circle cx="${px + 22}" cy="${py - 22}" r="11" fill="#f3ead2" stroke="#1d1530" stroke-width="3"/>${nested(I.bone, px + 14, py - 30, 16)}` : ''}</g>`;
        });
        s += `<g class="badge"><circle cx="${r.x}" cy="${r.y + 16}" r="${done ? 30 : 26}" fill="${done ? '#ffd21f' : '#fff8ea'}" stroke="#1d1530" stroke-width="4"/><text x="${r.x}" y="${r.y + 25}" text-anchor="middle" font-size="26" font-weight="900" fill="#1d1530">${done ? '★' : regionDoneCount(r.id) + '/3'}</text></g>`;
        s += `<text x="${r.x}" y="${r.y + 70}" text-anchor="middle" font-size="19" font-weight="900" fill="#fff" stroke="#1d1530" stroke-width="5" paint-order="stroke">${esc(r.name)}</text>`;
      } else {
        s += `<g opacity=".93" pointer-events="none"><ellipse cx="${r.x - 30}" cy="${r.y + 6}" rx="62" ry="38" fill="#eef2ff"/><ellipse cx="${r.x + 34}" cy="${r.y}" rx="58" ry="42" fill="#f6f8ff"/><ellipse cx="${r.x}" cy="${r.y - 26}" rx="50" ry="36" fill="#ffffff"/></g>`;
        if (ready) s += `<g class="gate" data-r="${r.id}"><circle cx="${r.x}" cy="${r.y}" r="34" fill="#ffd21f" stroke="#1d1530" stroke-width="4"><animate attributeName="r" values="32;37;32" dur="1.4s" repeatCount="indefinite"/></circle>${nested(FAM_ICON[r.gate], r.x - 18, r.y - 18, 36)}</g><text x="${r.x}" y="${r.y + 62}" text-anchor="middle" font-size="20" font-weight="900" fill="#1d1530">Άνοιξε τον δρόμο!</text>`;
        else s += nested(I.lock, r.x - 16, r.y - 16, 32, '#8d8aa6');
      }
      s += `</g>`;
    });
    const r0 = ISL.regions[0], side = r0.x < 500 ? -1 : 1, bx = r0.x + side * 150, by = r0.y + 4;
    s += `<g transform="translate(${bx} ${by + 70}) rotate(${-14 * side})"><path d="M-34 0 Q-8 -18 34 0 Q-8 16 -34 0Z" fill="#d5dbea" stroke="#1d1530" stroke-width="3"/><circle cx="6" cy="0" r="6" fill="#7fe9ff" stroke="#1d1530" stroke-width="2"/></g>`;
    s += `<g class="basebtn" id="mapbase" style="cursor:pointer"><rect x="${bx - 43}" y="${by - 30}" width="86" height="64" rx="10" fill="#e8292c" stroke="#1d1530" stroke-width="4"/><path d="M${bx - 51} ${by - 30} l51 -34 l51 34z" fill="#d5dbea" stroke="#1d1530" stroke-width="4"/><text x="${bx}" y="${by + 10}" text-anchor="middle" font-size="18" font-weight="900" fill="#fff">ΒΑΣΗ</text></g>`;
    const at = ISL.regions[ST.at] || r0, sp = ST.active;
    if (sp) s += `<g transform="translate(${at.x + 44} ${at.y - 8})"><circle r="26" fill="#fff" stroke="#1d1530" stroke-width="3"/><svg x="-22" y="-22" width="44" height="44" viewBox="${{ trex: '102 4 54 54', trike: '108 0 54 60', stego: '104 34 50 50', raptor: '96 4 50 50' }[sp]}">${A.dinoInner(sp, ST.dinos[sp])}</svg></g>`;
    const xs = ISL.regions.map(r => r.x), ys = ISL.regions.map(r => r.y);
    const vx = Math.min(...xs) - 215, vy = Math.min(...ys) - 150, vw = Math.max(...xs) + 215 - vx, vh = Math.max(...ys) + 150 - vy;
    return `<svg class="island" viewBox="${vx} ${vy} ${vw} ${vh}" preserveAspectRatio="xMidYMid meet">${s}</svg>`;
  }
  function offerCardHTML(o, i) {
    const f = C.FAMS[o.fam] || { title: o.fam };
    const badge = C.KIND_BADGE[o.kind] || '';
    const where = { decorate: 'Εργαστήρι στολισμού', museum: 'Μουσείο', penalty: 'Γήπεδο', bones: 'Εργαστήριο', ramp: 'Εργαστήριο' }[o.fam] || (findPoi(o.fam) ? ISL.regions[findPoi(o.fam).r].name : 'Βάση');
    return `<button class="card fam-${o.fam}" data-o="${i}"><span class="ico">${FAM_ICON[o.fam] || I.star}</span><span><span class="t">${esc(f.title)}${badge ? `<span class="kb">${esc(badge)}</span>` : ''}</span><br><span class="s">${esc(where)}</span></span></button>`;
  }
  function findPoi(fam) {
    const order = [ST.at].concat(ISL.regions.map(r => r.id).filter(id => id !== ST.at));
    for (const rid of order) { if (!regionOpen(rid)) continue; const p = ISL.regions[rid].pois.find(p => p.fam === fam && !poiDone(rid, p.k)); if (p) return { r: rid, k: p.k }; }
    return null;
  }
  function renderMap() {
    const res = offers();
    S.lastOffers = res.offers;
    app().innerHTML = `<div class="screen">${barHTML('Νησί ' + ST.island, false).replace('<div class="ttl">', `<button class="btn sq" id="home" aria-label="Αρχή">${I.home}</button><div class="ttl">`)}
      <div class="mapwrap"><div class="mapbox" id="mapbox">${islandSVG()}</div>
      <div class="side"><h3>Ο ΜΠΙΠ προτείνει</h3>${res.offers.map(offerCardHTML).join('')}
        <button class="card" id="tobase"><span class="ico" style="background:#e8292c;color:#fff">${I.home}</span><span><span class="t">Βάση</span><br><span class="s">Κτίρια, Dinobots, πειράματα</span></span></button></div></div></div>`;
    $('#home').onclick = () => go('home');
    $('#tobase').onclick = () => go('base');
    $('#mapbase').addEventListener('click', () => go('base'));
    $$('.card[data-o]').forEach(b => b.onclick = () => startOffer(S.lastOffers[+b.dataset.o]));
    $$('.poi').forEach(g => g.addEventListener('click', e => { e.stopPropagation(); tapPoi(+g.dataset.r, +g.dataset.k); }));
    $$('.gate').forEach(g => g.addEventListener('click', e => { e.stopPropagation(); tapGate(+g.dataset.r); }));
    $$('.region').forEach(g => g.addEventListener('click', () => { const r = ISL.regions[+g.dataset.r]; speak(regionOpen(r.id) ? r.name : 'Αυτή η περιοχή είναι ακόμα στα σύννεφα.'); }));
    if (S.pacingNote) { S.pacingNote = false; setTimeout(() => toast('Ο ΜΠΙΠ λέει: ας κάνουμε κάτι πιο χαλαρό! Ή μήπως ένα διάλειμμα για νερό;', 4200), 300); speak('Ας κάνουμε κάτι πιο χαλαρό! Ή μήπως ένα διάλειμμα για νερό;'); }
    checkStory();
  }
  function tapPoi(rid, k) {
    const p = ISL.regions[rid].pois[k];
    if (!famOpen(p.fam)) { const why = p.fam === 'mistake' ? 'Αυτό θα ανοίξει όταν γνωρίσουμε κάποιον… σκουριασμένο!' : 'Εδώ θα παίξουμε μπάλα, όταν χτίσουμε γήπεδο στη βάση!'; toast(why); speak(why); return; }
    ST.at = rid;
    const replay = poiDone(rid, k);
    launch({ fam: p.fam, kind: p.fam === 'code' ? null : kindFor(p.fam), origin: { type: 'poi', r: rid, k, fossil: p.fossil }, replay });
  }
  function tapGate(rid) {
    const r = ISL.regions[rid], fam = r.gate;
    launch({ fam, kind: fam === 'code' ? 'boss' : 'edge', bump: fam === 'code' ? 0 : 0.5, origin: { type: 'gate', r: rid } });
  }
  /* which Dino-κώδικας family a 'code' place on the map should offer now: the selector's choice among the open ones */
  function codeFam(kind) {
    const cats = CATALOG.filter(c => c.code);
    const res = E.selectMissions(EN, cats, now(), 'code|' + ST.seed + '|' + ST.missions, 1);
    const o = res.offers[0] || { fam: 'code_seq', kind: 'edge' };
    return { fam: o.fam, kind: kind || o.kind };
  }
  function launch(o) {
    let fam = o.fam;
    if (fam === 'code') { const c = codeFam(o.kind && o.kind !== 'edge' ? o.kind : null); fam = c.fam; o = Object.assign({}, o, { fam, kind: o.kind === 'boss' ? 'boss' : c.kind }); }
    const cat = catOf(fam);
    if (cat && cat.code) return App.startCode(o);
    if (fam === 'football' || fam === 'sumo') return App.startArena(Object.assign({}, o, { mode: fam }));
    if (fam === 'factory') return App.startFactory(o);
    return App.startMission(o);
  }
  /* due retrieval for this family takes priority; otherwise the current edge */
  function kindFor(fam) {
    const cat = catOf(fam); if (!cat) return 'edge';
    const due = new Set(E.dueSkills(EN, now()).map(d => d.id));
    if ((EN.fams[fam] || {}).n && [cat.primary].concat(cat.skills).some(s => due.has(s))) return 'retrieval';
    return 'edge';
  }
  function startOffer(o) {
    if (!o) return;
    if (o.fam === 'decorate') return go('workshop');
    if (o.fam === 'museum') return go('museum');
    if (o.fam === 'penalty') return App.startPenalty({ type: 'free' });
    if (o.fam === 'bones') return startBones();
    if (o.fam === 'ramp') return App.startMission({ fam: 'ramp', kind: o.kind, d: o.d, origin: { type: 'lab' } });
    if (o.fam === 'football' || o.fam === 'sumo' || o.fam === 'factory') return launch({ fam: o.fam, kind: o.kind, origin: { type: 'base' } });
    const cat = catOf(o.fam), poiFam = cat && cat.code ? 'code' : o.fam;
    const p = findPoi(poiFam);
    if (p && o.kind !== 'retrieval') { ST.at = p.r; return launch({ fam: o.fam, kind: o.kind, d: o.d, origin: { type: 'poi', r: p.r, k: p.k, fossil: ISL.regions[p.r].pois[p.k].fossil } }); }
    launch({ fam: o.fam, kind: o.kind, d: o.d, origin: { type: 'free' } });
  }
  function startBones() {
    const sp = ST.fossils[0];
    if (sp) return App.startMission({ fam: 'bones', kind: 'edge', species: sp, origin: { type: 'fossil', sp } });
    const owned = dinoList();
    App.startMission({ fam: 'bones', kind: kindFor('bones'), species: owned[ST.missions % owned.length], origin: { type: 'lab' } });
  }

  /* ---------- base ---------- */
  function renderBase() {
    const blds = Object.keys(C.BUILDINGS).map(id => {
      const b = C.BUILDINGS[id], have = !!ST.build[id];
      const needDinos = b.needDinos && dinoList().length < b.needDinos;
      let act = '';
      if (have) act = `<button class="btn sm yl" data-go="${id}">Μπες</button>`;
      else if (needDinos) act = `<span class="small">Χρειάζεσαι ${b.needDinos} Dinobots</span>`;
      else act = `<button class="btn sm ${ST.cr >= b.cost ? 'go' : ''}" data-build="${id}" ${ST.cr >= b.cost ? '' : 'disabled'}>Χτίσε: ${b.cost} ${A.PIECE.s}</button>`;
      const BICON = { lab: I.flask, workshop: I.brush, museum: I.museum, stadium: I.ball };
      const art = id === 'lab' && ST.fossils.length ? `<span class="dw" style="width:70px">${A.dinoSVG(ST.fossils[0], { col: 0 }, '').replace('class="dino', 'style="filter:grayscale(1) brightness(1.4)" class="dino')}</span><span class="small">Απολίθωμα: ${esc(C.SPECIES[ST.fossils[0]].name)}!</span>` : `<span style="font-size:3rem;color:${have ? 'var(--ink)' : 'var(--muted)'}">${BICON[id]}</span>`;
      return `<div class="bld ${have ? '' : 'locked'}"><div class="bt">${esc(b.name)}</div><div class="bs">${esc(b.about)}</div><div class="art">${art}</div><div class="row">${act}</div></div>`;
    }).join('');
    const team = dinoList().map(sp => `<button class="card" data-active="${sp}" style="min-height:0;padding:6px 10px"><span style="width:90px">${A.dinoSVG(sp, ST.dinos[sp])}</span><span class="t">${esc(C.SPECIES[sp].robo)}${ST.active === sp ? ' ✓' : ''}</span></button>`).join('');
    app().innerHTML = `<div class="screen">${barHTML('Η βάση', true)}
      ${talkHTML(ST.fossils.length ? 'Έχουμε απολίθωμα! Πάμε στο εργαστήριο να στήσουμε τον σκελετό!' : 'Η βάση μας! Με κρυστάλλους χτίζουμε νέα κτίρια.', 'bip')}
      <div class="basegrid">${blds}</div>
      ${team ? `<div class="panel"><div class="lbl">Τα Dinobots σου (διάλεξε συνοδό)</div><div class="row">${team}</div></div>` : ''}</div>`;
    $('#back').onclick = () => go('map'); wireSay();
    $$('[data-build]').forEach(b => b.onclick = () => build(b.dataset.build));
    $$('[data-go]').forEach(b => b.onclick = () => enterBuilding(b.dataset.go));
    $$('[data-active]').forEach(b => b.onclick = () => { ST.active = b.dataset.active; save(); renderBase(); });
    checkStory();
  }
  function build(id) {
    const b = C.BUILDINGS[id];
    if (ST.cr < b.cost || ST.build[id]) return;
    const before = ST.cr; ST.cr -= b.cost; ST.build[id] = 1; save(); sfx.ok();
    const pieces = n => `${Math.floor(n / 10)} ράβδοι και ${n % 10} θραύσματα`;
    overlay(`<h2>${esc(b.name)}: έτοιμο!</h2><p>Είχαμε ${before} κρυστάλλους. Δώσαμε ${b.cost}. Μας έμειναν ${ST.cr}.</p><p class="small">${esc(pieces(ST.cr))}</p><button class="btn go" id="ok">Τέλεια!</button>`);
    speak(`${b.name}: έτοιμο! Είχαμε ${before} κρυστάλλους, δώσαμε ${b.cost}, μας έμειναν ${ST.cr}.`);
    $('#ok').onclick = () => { closeOv(); renderBase(); };
  }
  function enterBuilding(id) {
    if (id === 'workshop') return go('workshop');

        <div class="row" style="justify-content:center">

          <button class="card fam-ramp" id="lr" ${canRamp ? '' : 'disabled style="opacity:.5"'}><span class="ico">${I.flask}</span><span><span class="t">Πείραμα με ράμπες</span><br><span class="s">${canRamp ? 'Πρόβλεψε, δοκίμασε, εξήγησε' : 'Μετά τον πρώτο Dinobot'}</span></span></button>
        </div><button class="btn sm" id="lx">Πίσω</button>`);
      ov.querySelector('#lb').onclick = () => { if (!ST.fossils.length && !dinoList().length) { toast('Πρώτα βρες ένα απολίθωμα με ανασκαφή!'); return; } startBones(); };

  /* ---------- museum ---------- */
  function renderMuseum() {
    S.musT0 = S.musT0 || now();
    const cards = C.FOSSIL_ORDER.map(sp => {
