async function zapFx(e){
  const f=$('#foe'),b=$('#board'),p=e.res==='miss'?S.rp:S.D.foe;
  if(b&&p){const z=document.createElement('div');z.className='zapfx '+e.res;z.style.cssText=cellPos(p);z.innerHTML=burst(FXC[ST.robot.zap||0]);b.appendChild(z);setTimeout(()=>z.remove(),520);}
  if(e.res==='hit'){
    sfx.zap();if(f){f.classList.remove('hit');void f.offsetWidth;f.classList.add('hit');}
    $$('.lamps').forEach(l=>l.innerHTML=lampsHTML(e.hp,S.L.duel.hp));
    if(e.hp>0)bubble('Τον πέτυχα! Έσβησε ένα φωτάκι.');
  }else if(e.res==='shield'){
    sfx.bump();const sh=$('#shd');if(sh){sh.classList.remove('clang');void sh.offsetWidth;sh.classList.add('clang');}
    bubble('Ντονκ! Η ασπίδα του με σταμάτησε.');
  }else{sfx.no();bubble('Το ΖΑΠ δεν έφτασε. Πρέπει να είμαι δίπλα του.');}
  await sleep(e.res==='hit'?750:1300);
}
async function fireFx(shot,id){
  sfx.shot();const f=$('#foe');if(f){f.classList.remove('fire','hit');void f.offsetWidth;f.classList.add('fire');}
  const dz=$$('#dzs .dz');
  for(let i=0;i<shot.cells.length;i++){if(dz[i])dz[i].classList.add('fire');await sleep(65);if(id!==S.runId)return;}
  await sleep(170);dz.forEach(e=>e.classList.remove('fire'));
}
async function runDuel(){
  if(S.running)return;
  const D=S.D,L=S.L;S.sel=null;
  if(!S.prog.length){renderSide();sfx.no();shake('#pal');bubble('Βάλε πρώτα εντολές!');return;}
  const id=++S.runId;S.running=true;renderSide();
  const rm=$('#remind');if(rm)rm.remove();S.remind='';
  const res=simulate(L,S.prog,{x:D.x,y:D.y},[],{form:D.form,crates:D.crates,foe:D.foe,energy:L.duel.energy});
  await sleep(240);
  if(!(await play(res,id,300)))return;
  hot(null);
  D.x=res.x;D.y=res.y;D.form=res.form;D.crates=res.crates;D.foe=res.foe;drawDanger();
  const r=$('#rob');if(r)r.classList.remove('hop','fast');
  if(res.ok){                                   // every lamp is out
    const f=$('#foe');if(f)f.classList.add('out');const dz=$('#dzs');if(dz)dz.innerHTML='';
    if(r)r.classList.add('jump');
    bubble(`Έσβησαν όλα τα φωτάκια! ${FOES[L.duel.who].name}, καλό παιχνίδι!`);
    await sleep(1500);if(id!==S.runId)return;
    S.running=false;if(S.at)logE('run',S.at.id,{ok:true,replay:S.at.replay,firstOfEntry:S.at.runs++===0});finish(Math.max(1,D.hearts));return;
  }
  if(res.why!=='round'){bubble(failText(res));await sleep(1500);}else await sleep(380);
  if(id!==S.runId)return;
  const shot=foeShot(L,D);
  if(S.lesson){$$('#dzs .dz').forEach(e=>e.classList.add('warn'));await sleep(1100);if(id!==S.runId)return;$$('#dzs .dz').forEach(e=>e.classList.remove('warn'));}
  await fireFx(shot,id);if(id!==S.runId)return;
  const flash=c=>{if(r){r.classList.remove('hurt','ding','bump');void r.offsetWidth;r.classList.add(c);}};
  if(S.lesson){                                 // lesson round: no hearts, just see what the line means
    const Ls=S.lesson,st=LESSON[Ls.id].steps[Ls.i];S.running=false;
    if(shot.stop==='hit'){flash('hurt');sfx.bump();bubble(st.retry);await sleep(2100);if(id===S.runId&&S.lesson===Ls)stepLesson();}
    else{Ls.state='done';renderSide();sfx.pick();bubble(st.win);}
    return;
  }
  if(shot.stop==='hit'){
    D.hearts--;flash('hurt');sfx.bump();renderSide();
    bubble(D.hearts>0?'Άουτς! Ήμουν πάνω στην κόκκινη γραμμή.':'Μπζζτ… έσβησα!');
  }else if(shot.stop==='armour'){flash('ding');sfx.ding();bubble('Ντινγκ! Η θωράκιση του τανκ με έσωσε.');}
  else if(shot.stop==='crate'){sfx.push();bubble('Το κιβώτιο σταμάτησε τη βολή!');}
  await sleep(shot.stop==='clear'?260:1700);if(id!==S.runId)return;
  if(D.hearts<=0){const n=S.fails+1;if(S.at)logE('run',S.at.id,{ok:false,replay:S.at.replay,firstOfEntry:S.at.runs++===0});startDuel(S.lvl,true);S.fails=n;return;}   // lose: nothing is taken away, the duel simply restarts
  const nf=foeNext(L,D),changed=nf.d!==D.foe.d||nf.x!==D.foe.x||nf.y!==D.foe.y;
  D.foe=nf;D.round++;
  if(changed){
    D.ang=turnTo(D.ang,nf.d);const f=$('#foe'),sh=$('#shd');
    if(f){f.style.left=nf.x*100/L.cols+'%';f.style.top=nf.y*100/L.rows+'%';}
    if(sh)sh.style.transform=`rotate(${D.ang}deg)`;
    sfx.step();await sleep(480);if(id!==S.runId)return;
  }
  S.prog=[];S.running=false;drawDanger();renderSide();
  if(shot.stop==='clear')bubble(changed?`Γύρος ${D.round}. Πρόσεξε, γύρισε!`:`Γύρος ${D.round}. Η μπαταρία γέμισε.`);
}

const mini=d=>`<span class="mblk">${I.arrow(d)}</span>`;
const REMIND={                                  // one small picture-reminder on the second meeting with a rule
  loop:()=>`${mini('R')}${mini('R')}${mini('R')}<b>=</b><span class="mblk yl">${I.loop}</span><b>×3</b>${mini('R')}`,
  fn:()=>`<span class="mblk pu">${I.trick}</span><b>=</b>${mini('R')}${mini('D')}${mini('L')}<b>…</b>`,
  if:()=>`<b>ΑΝ</b><i class="msq k-red"></i>${mini('D')}<span>μόνο στο κόκκινο</span>`,
  car:()=>`${FI.bot}<span>ένα τετράγωνο</span>${FI.car}<span>μέχρι τον τοίχο</span>`,

  duel:()=>`<i class="msq dzs"></i><span>εκεί ρίχνει</span><i class="msq shs"></i><span>ασπίδα μόνο μπροστά</span>`
};
function startLesson(id,then,replay){S.lesson={id,i:0,then,replay:!!replay,state:'ready',folded:false};closeOv();stepLesson();}
function stepLesson(){
  const Ls=S.lesson,st=LESSON[Ls.id].steps[Ls.i];
  S.screen='play';S.studio=false;S.runId++;S.running=false;S.picked=[];S.sel=null;S.arm=null;S.open=null;S.D=null;S.remind='';
  const d=st.g?{t:st.duel?'duel':'code',g:st.g,tiles:st.tiles,veh:st.veh,form:st.form,forms:st.forms,cycle:st.cycle,hp:st.hp,foe:'rusty'}:{t:'code',fn:st.fn};
  S.def=d;S.L=st.g?parseLevel(d):Object.assign(blankLevel(st.cols,st.rows,{x:st.start[0],y:st.start[1]}),{pen:true,trail:false});
  if(st.duel){S.D=duelInit(S.L);S.D.ang=ANG[S.D.foe.d];}
  S.prog=st.p?P(st.p):[];if(st.mode!=='use')S.fn=[];
  if(st.mode==='def'){S.prog=[{t:'call'}];S.open='F';}
  S.max=st.max||(st.duel?S.L.duel.energy:4);S.fmax=st.fn||0;S.ifc=[];S.inf=false;S.loopOK=false;S.color='blue';
  Ls.state='ready';Ls.folded=false;
  renderLesson(st.say);speak(st.say);
  if(st.k==='show')autoShow();
}
function renderLesson(say){
  const Ls=S.lesson,T=LESSON[Ls.id],st=T.steps[Ls.i];
  const cands=st.k==='predict'?st.cands.map(([x,y],i)=>`<button class="cand k-${['blue','red','green'][i]}" data-act="lguess" data-i="${i}" style="${cellPos({x,y})}" aria-label="${LET[i]}"><b>${LET[i]}</b></button>`).join(''):'';
  app.innerHTML=`<div class="screen play lesson">
    <header class="bar"><button class="btn sq" data-act="map" aria-label="Πίσω">${I.back}</button><div class="ttl"><span class="newtag">ΝΕΟ</span>${T.name}</div>
      <span class="ldots">${T.steps.map((_,i)=>`<i class="${i<Ls.i?'d':i===Ls.i?'c':''}"></i>`).join('')}</span>
      <button class="btn sq" data-act="lskip" aria-label="Παράλειψη">${I.skip}</button><button class="btn sq" data-act="resay" aria-label="Πες το ξανά">${I.speaker}</button></header>
    ${talkHTML(say)}
    <div class="playgrid"><div class="stage">${boardHTML(cands)}</div><div class="side"></div></div></div>`;
  renderSide();setNib();if(S.D)drawDanger();
}
function lessonSide(){
  const el=$('.side');if(!el)return;
  const Ls=S.lesson,steps=LESSON[Ls.id].steps,st=steps[Ls.i],last=Ls.i>=steps.length-1;
  const next=`<button class="btn go pulse" data-act="lnext" aria-label="Συνέχεια">${last?'ΠΑΙΞΕ!':''}${I.play}</button>`;
  let h;
  if(st.k!=='try'){
    const keep=S.prog;if(st.fold&&!Ls.folded)S.prog=P(st.fold);
    h=`<div class="prog ro ${st.fold&&!Ls.folded?'tofold':st.fold?'folded':''}" id="prog">${progHTML(true)}</div>${fnHTML(true)}`;S.prog=keep;
    h+=`<div class="ctl" id="tctl">${Ls.state==='done'?next:`<p class="tip">${st.k==='predict'?'Πάτα ένα κυκλάκι.':'Κοίτα τι κάνω…'}</p>`}</div>`;
  }else{
    const def=st.mode==='def',use=st.mode==='use';
    h=`<div class="prog ${def?'ro':''} ${S.D?'duel':''}" id="prog">${def?progHTML(true):S.D?duelProgHTML():progHTML()}</div>${fnHTML(use)}`;
    if(Ls.state==='done')h+=`<div class="ctl">${next}</div>`;
    else{
      h+=`<div class="pal" id="pal">`;
      if(!use)h+=['L','U','D','R'].map(d=>`<button class="blk" data-act="add" data-c="${d}" aria-label="${DN[d]}">${I.arrow(d)}</button>`).join('');
      if(st.forms)h+=st.forms.map(f=>`<button class="blk tf fmb pulse" data-act="addform" data-f="${f}" aria-label="γίνε ${FNAME[f]}">${FI[f]}<b>${FLAB[f]}</b></button>`).join('');
      if(use)h+=`<button class="blk call pulse" data-act="addcall" aria-label="Βάλε το κόλπο">${I.trick}</button>`;
      h+=`</div><div class="ctl"><button class="btn sq" data-act="undo" aria-label="Σβήσε">${I.undo}</button>${S.running?`<button class="btn go" disabled>${I.play}ΠΑΜΕ!</button>`:`<button class="btn go" data-act="run">${I.play}ΠΑΜΕ!</button>`}</div>`;
    }
  }
  el.innerHTML=h;fit();
}
async function autoShow(){                      // a demonstration plays by itself, then waits for the child
  const Ls=S.lesson,st=LESSON[Ls.id].steps[Ls.i],id=++S.runId;
  await sleep(1200);if(id!==S.runId)return;
  if(st.fold){
    const p=$('#prog');if(p)p.classList.add('folding');sfx.morph();
    await sleep(900);if(id!==S.runId)return;
    Ls.folded=true;renderSide();await sleep(700);if(id!==S.runId)return;
  }
  S.running=true;
  const res=S.D?simulate(S.L,S.prog,{x:S.D.x,y:S.D.y},[],{form:S.D.form,crates:S.D.crates,foe:S.D.foe,energy:99}):simulate(S.L,S.prog,null,S.fn);
  if(!(await play(res,id,430)))return;
  hot(null);S.running=false;
  await sleep(400);if(id!==S.runId)return;
  Ls.state='done';renderSide();if(st.after)bubble(st.after);
}
function lessonRan(res){
  const Ls=S.lesson,st=LESSON[Ls.id].steps[Ls.i];
  if(st.ok?st.ok(res):res.ok){Ls.state='done';renderSide();sfx.pick();bubble(st.win);return;}
  renderSide();bubble(['short','free','draw','round','edge'].includes(res.why)||!res.why?st.retry:failText(res));
  setTimeout(()=>{if(S.lesson===Ls&&Ls.state!=='done'&&!S.running)resetBoard();},1600);
}
function endLesson(){
  const Ls=S.lesson;if(!Ls)return;S.lesson=null;S.runId++;S.running=false;stopSpeak();
  if(!Ls.replay){ST.tut[Ls.id]=Math.max(+ST.tut[Ls.id]||0,1);ST.tutAt[Ls.id]=S.pendingId;save();}
  if(Ls.then)Ls.then();else go('map');
}
function ghost(e){                               // the star spells out the steps it remembers, the first few times
  let g=$('#ghost');
  const on=e&&e.f!=null&&S.fn.length&&(S.lesson||(+ST.tut.ghost||0)<GHOST_N||S.gk!=null);
  const host=on?$('#prog .blk.hot'):null,p=$('#prog');
  if(!on||!host||!p){if(g)g.remove();S.gk=null;return;}
  const key=(e.src||[]).join('-')+':'+(e.k||0);
  if(S.gk!==key){S.gk=key;if(!S.lesson)ST.tut.ghost=(+ST.tut.ghost||0)+1;}
  if(!g){g=document.createElement('div');g.id='ghost';g.className='ghost';p.appendChild(g);}
  g.innerHTML=`<span class="mblk pu">${I.trick}</span><b>=</b>`+S.fn.map((c,j)=>`<span class="mblk ${j===e.f?'on':''}" data-g="${j}">${c.t==='tf'?(c.to?FI[c.to]:I.morph):c.t==='ifc'?`<i class="msq k-${c.col}"></i>${I.arrow(c.c)}`:I.arrow(c.c)}</span>`).join('');
  const hr=host.getBoundingClientRect(),pr=p.getBoundingClientRect();
  g.style.left=Math.max(4,Math.min(hr.left-pr.left-4,pr.width-g.offsetWidth-8))+'px';g.style.top=hr.top-pr.top-g.offsetHeight-9+'px';
}
function nope(msg,where){sfx.no();shake(where||'#prog');if(msg)bubble(msg);}
function addCmd(b){
  if(S.running)return;
  if(S.arm&&b.t==='cmd'){b={t:'ifc',col:S.arm,c:b.c};S.arm=null;}
  if(S.D){                                      // duel: every block is paid for from this round's battery
    const np=S.prog.slice();if(S.sel)np[S.sel.i]=b;else np.push(b);
    if(np.filter(q=>q.t==='zap').length>1)return nope('Ένα ΖΑΠ σε κάθε γύρο!');
    if(progCost(np,S.D.form).total>S.L.duel.energy)return nope(b.t==='zap'?'Δεν φτάνει η μπαταρία! Το ΖΑΠ θέλει 2.':progCost(np,S.D.form).form==='tank'&&b.t==='cmd'?'Δεν φτάνει η μπαταρία! Το τανκ ξοδεύει 2 σε κάθε βήμα.':'Δεν φτάνει η μπαταρία!');
    S.prog=np;S.sel=null;sfx.tap();if(S.at&&!S.lesson)logE('edit',S.at.id);renderSide();return;
  }
  const inTrick=b.t==='call'||b.t==='col';
  if(S.sel){                                    // a block is picked: swap it for the new one
    const s=S.sel;
    if(s.w==='f'){if(b.t==='call')return nope('Το κόλπο δεν χωράει μέσα στον εαυτό του.','#fn');if(b.t==='col')return nope('','#fn');S.fn[s.j]=b;}
    else if(s.j!=null)S.prog[s.i].body[s.j]=b;
    else S.prog[s.i]=b;
    S.sel=null;sfx.tap();if(S.at&&!S.lesson&&!S.studio)logE('edit',S.at.id);renderSide();return;
  }
  if(S.open==='F'){
    if(inTrick)return nope(b.t==='call'?'Το κόλπο δεν χωράει μέσα στον εαυτό του.':'','#fn');
    if(S.fn.length>=S.fmax)return nope('Το κόλπο γέμισε!','#fn');
    S.fn.push(b);
  }else{
    if(blockCount(S.prog)>=S.max)return nope(S.fmax?'Γέμισαν οι θέσεις! Βάλε βήματα μέσα στο κόλπο.':S.loopOK?'Γέμισαν οι θέσεις! Το ΞΑΝΑ χωράει πολλά βήματα.':'Γέμισαν οι θέσεις! Σβήσε κάτι.');
    if(S.open!=null)S.prog[S.open].body.push(b);else S.prog.push(b);
  }
  if(S.at&&!S.lesson&&!S.studio)logE('edit',S.at.id);
  sfx.tap();renderSide();
}

function startMath(game,tier,lv){S.screen='math';S.D=null;S.def=null;S.remind='';S.at={id:lv&&lv.id?lv.id:'p:'+game,replay:!!(lv&&ST.stars[lv.id]),runs:0};logE('enter',S.at.id);S.lvl=lv||null;S.runId++;S.running=false;closeOv();S.m={game,tier,total:ROUND[game],qi:0,first:0,q:null};S.said='';newQ();}
function newQ(){
  const m=S.m,gen={studs:genStuds,tower:genTower,pattern:genPattern,trace:genTrace,logic:genLogic}[m.game];
  let q,n=0;const sig=x=>JSON.stringify([x.answer,x.target,x.seq,x.bricks,x.prog,x.grid]);
  do{q=gen(m.tier);}while(m.q&&n++<8&&sig(q)===sig(m.q));
  m.q=q;m.wrong=0;m.done=false;m.busy=false;m.stack=[];m.help=false;m.tried=new Set();m.fresh=false;
  if(m.game==='logic'){q.cur=q.grid.slice();m.sel=q.cur.indexOf(-1);m.clash=[];m.bad=-1;m.last=-1;}
  if(m.game==='trace'){S.runId++;S.L=q.L;S.prog=q.prog;S.fn=q.fn;S.fmax=0;S.max=blockCount(q.prog);S.open=null;S.sel=null;S.arm=null;S.studio=false;S.picked=[];S.color='orange';}
  renderMath();
  const p=mathPrompt();if(p!==S.said){S.said=p;speak(p);}
}
function mathPrompt(){
  const m=S.m,q=m.q;
  if(m.game==='studs')return q.bricks.length>1?'Πόσες κουκκίδες έχουν και τα δύο μαζί;':'Πόσες κουκκίδες έχει το τουβλάκι;';
  if(m.game==='pattern')return q.answer.k==='n'?'Ποιος αριθμός λείπει;':'Ποιο τουβλάκι λείπει;';
  if(m.game==='trace')return 'Διάβασε το πρόγραμμα. Σε ποιο γράμμα θα σταματήσω;';
  if(m.game==='logic')return q.box?'Κάθε σειρά, κάθε στήλη και κάθε κουτί θέλει και τα τέσσερα χρώματα.':'Κάθε σειρά και κάθε στήλη θέλει και τα τρία χρώματα.';
  let t=q.start?`Ο πύργος έχει ύψος ${q.start}. Φτάσε ακριβώς στο ${q.target}`:`Χτίσε πύργο με ύψος ακριβώς ${q.target}`;
  if(q.maxBricks)t+=`, με το πολύ ${q.maxBricks} τουβλάκια`;
  return t+'!';
}
function brickSVG(b,num,from){
  const U=40,w=b.c*U+8,h=b.r*U+8;let n=from||0;
  let s=`<svg class="sbrick" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><rect class="bd" x="2" y="2" width="${w-4}" height="${h-4}" rx="7" fill="var(--${b.color})"/>`;
  for(let y=0;y<b.r;y++)for(let x=0;x<b.c;x++){n++;const cx=4+x*U+U/2,cy=4+y*U+U/2;
    s+=`<circle class="sd" cx="${cx}" cy="${cy}" r="13" ${num?'style="fill:#fff"':''}/>`;
    if(num)s+=`<text x="${cx}" y="${cy}" style="animation-delay:${((n-1)*.06).toFixed(2)}s;transform-origin:${cx}px ${cy}px">${n}</text>`;}
  return s+'</svg>';
}
const tile=(it,cls)=>it.k==='c'?`<span class="pt k-${it.v} ${cls||''}"></span>`:`<span class="pt ${cls||''}">${it.v}</span>`;
function ansBtn(v,inner){
  const m=S.m,a=m.game==='pattern'?m.q.answer.v:m.q.answer,no=m.tried.has(String(v)),yes=m.done&&String(v)===String(a);

function mathBar(){const m=S.m;return `<header class="bar"><button class="btn sq" data-act="map" aria-label="Πίσω">${I.back}</button><div class="ttl">${GAME[m.game]}</div><div class="mpips">${pipsHTML()}</div><button class="btn sq" data-act="resay" aria-label="Πες το ξανά">${I.speaker}</button></header>`;}

function endMath(){
  const m=S.m,g=m.game,stars=m.first===m.total?3:(m.first>=m.total-2&&m.first>0)?2:1;

/* ---------- win ---------- */
function burstSVG(){
  let pts='';const n=14;
  for(let i=0;i<n*2;i++){const a=i*Math.PI/n,r=i%2?37:49;pts+=(50+Math.cos(a)*r).toFixed(1)+','+(50+Math.sin(a)*r).toFixed(1)+' ';}
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polygon points="${pts}" fill="var(--red)" stroke="#17142a" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}
function finish(stars){
  const lv=S.lvl;let extra='',nextBtn;
  if(S.at){logE('win',S.at.id,{stars});if(S.screen==='play')logE('mech',null,{list:progMechs(S.prog,S.fn)});flushLog();}
  const turbo=lv&&S.def&&S.def.gen==='turbo'&&S.screen==='play';
  if(turbo){const k=ST.skill.turbo||0;if(stars===3&&S.fails<=1)ST.skill.turbo=Math.min(4,Math.max(k,S.tier+1));else if(S.fails>=5)ST.skill.turbo=Math.max(0,Math.min(k,S.tier-1));}
  if(lv&&!lv.id){
    save();extra+=`<p class="note">Τούρμπο: βαθμίδα ${(ST.skill.turbo||0)+1} από 5</p>`;
    nextBtn=`<button class="btn go" data-act="practice" data-g="turbo" aria-label="Κι άλλο">${I.play}</button>`;
  }else if(lv){
    if(stars>(ST.stars[lv.id]||0))ST.stars[lv.id]=stars;save();
    const d=S.screen==='play'?S.def:lv.def,won=claimRewards(),r=won.find(r=>r.k==='ch')||won[won.length-1];
    if(r)extra+=`<div class="unlock"><b>${RNAME[r.k][0]}</b><span class="uprev">${optHTML(r.k,r.i)}${r.k==='ch'?`<i>${CHASSIS[r.i].name}</i>`:''}</span><button class="btn yl pulse" data-act="tryit" data-k="${r.k}" data-i="${r.i}">${I.wrench}ΔΟΚΙΜΑΣΕ ΤΟ</button></div>`;
    else extra+=teaserHTML();
    if((d.t==='code'||d.t==='draw')&&stars<3)extra+=`<p class="note">Με ${d.par} κουτάκια παίρνεις 3 αστέρια.</p>`;
    if(d.t==='duel'&&stars<3)extra+=`<p class="note">Χωρίς καμία ζημιά παίρνεις 3 αστέρια.</p>`;
    nextBtn=`<button class="btn go" data-act="nextlevel" aria-label="Επόμενο">${I.play}</button>`;
  }else{
    extra+=`<p class="note">${GAME[S.m.game]}: βαθμίδα ${(ST.skill[S.m.game]||0)+1} από 5</p>`;
    nextBtn=`<button class="btn go" data-act="practice" data-g="${S.m.game}" aria-label="Ξανά">${I.play}</button>`;
  }
  overlay(`<div class="burst">${burstSVG()}<span>${pick(CHEER)}</span></div><div class="stars3">${[1,2,3].map(k=>`<span class="${k<=stars?'on':''}" style="--d:${(k*.16).toFixed(2)}s">${I.star}</span>`).join('')}</div>${extra}
    <div class="row"><button class="btn sq" data-act="map" aria-label="Τα επεισόδια">${I.grid}</button><button class="btn sq" data-act="replay" aria-label="Παίξε το ξανά">${I.redo}</button>${nextBtn}</div>`);
  sfx.win();speak('Μπράβο!');
}

  pick:d=>{if(S.running)return;const s={w:d.w,i:d.i!=null?+d.i:undefined,j:d.j!=null?+d.j:undefined};S.sel=isSel(s.w,s.i,s.j)?null:s;sfx.tap();renderSide();},
  loop:()=>{if(S.running)return;if(blockCount(S.prog)>=S.max-1)return nope('Δεν χωράει άλλο ΞΑΝΑ. Σβήσε κάτι.');
    S.sel=null;S.prog.push({t:'loop',n:2,body:[]});S.open=S.prog.length-1;sfx.tap();renderSide();},
  fopen:()=>{if(S.running||S.lesson)return;dropEmptyLoop();S.sel=null;S.open=S.open==='F'?null:'F';sfx.tap();renderSide();},
  lclose:()=>{dropEmptyLoop();S.open=null;S.sel=null;sfx.tap();renderSide();},
  lopen:d=>{if(S.running)return;const i=+d.i;S.sel=null;S.open=S.open===i?null:i;renderSide();},

  ldec:d=>{if(S.running)return;const b=S.prog[+d.i];if(b.n===0){b.n=9;sfx.tap();}else if(b.n>2){b.n--;sfx.tap();}else sfx.no();renderSide();},
  ldel:d=>{if(S.running)return;const i=+d.i;S.prog.splice(i,1);S.sel=null;if(typeof S.open==='number'){if(S.open===i)S.open=null;else if(S.open>i)S.open--;}sfx.pop();renderSide();},
  undo:()=>{if(S.running)return;if(S.at&&!S.lesson&&!S.studio&&(S.prog.length||S.fn.length))logE('undo',S.at.id);

      if(s.w==='f')S.fn.splice(s.j,1);

      else{S.prog.splice(s.i,1);if(typeof S.open==='number'){if(S.open===s.i)S.open=null;else if(S.open>s.i)S.open--;}}}

    else if(S.open!=null){const b=S.prog[S.open];if(b.body.length)b.body.pop();else{S.prog.splice(S.open,1);S.open=null;}}

  clear:()=>{if(S.running)return;const pre=S.def&&S.def.pre;if(!pre&&!S.prog.length&&!S.fn.length)return;
    if(S.lesson){const st=LESSON[S.lesson.id].steps[S.lesson.i];if(st.mode==='def'){S.fn=[];sfx.pop();renderSide();return;}if(st.mode==='use'){S.prog=[];sfx.pop();renderSide();return;}}
    if(S.at&&!S.lesson&&!S.studio)logE('clear',S.at.id);
    S.prog=pre?P(pre.p):[];S.fn=pre?P(pre.f):[];S.open=null;S.sel=null;S.arm=null;sfx.pop();renderSide();},
  run:()=>run(),
  clean:()=>{S.runId++;S.running=false;S.pos={x:S.L.start.x,y:S.L.start.y};const g=$('#drawn');if(g)g.innerHTML='';moveRobot(S.pos.x,S.pos.y);hot(null);sfx.pop();renderSide();},
  ans:d=>{const m=S.m;if(!m||m.done)return;const a=m.game==='pattern'?m.q.answer.v:m.q.answer;
    if(String(d.v)===String(a)){m.done=true;if(!m.wrong)m.first++;sfx.pick();renderMath();}
    else{m.wrong++;m.tried.add(String(d.v));if(m.wrong>=2)m.help=true;sfx.no();renderMath();bubble(m.game==='studs'?'Μέτρα ξανά, σιγά σιγά.':'Κοίτα ξανά τη σειρά.');}},
  tadd:d=>{const m=S.m;if(!m||m.done)return;const q=m.q,v=+d.v,sum=q.start+m.stack.reduce((a,b)=>a+b,0);
    if(q.maxBricks&&m.stack.length>=q.maxBricks){m.wrong++;sfx.no();shake('.tinfo');bubble(`Μόνο ${q.maxBricks} τουβλάκια! Βγάλε ένα και βάλε πιο μεγάλο.`);return;}
    if(sum+v>q.target){m.wrong++;sfx.bump();const st=$('#tstack');

      bubble(`Πολύ ψηλά! Θέλω ακριβώς ${q.target}.`);return;}
    m.stack.push(v);m.fresh=true;
    if(sum+v===q.target){m.done=true;if(!m.wrong)m.first++;sfx.pick();}else sfx.tap();
    renderMath();},
  tpop:()=>{const m=S.m;if(!m||m.done||!m.stack.length)return;m.stack.pop();m.fresh=false;sfx.pop();renderMath();},
  guess:async(d,btn)=>{const m=S.m;if(!m||m.game!=='trace'||m.done||m.busy)return;m.busy=true;const q=m.q,pk=+d.i;btn.classList.add('pk');sfx.tap();
    const id=++S.runId,res=simulate(S.L,S.prog,null,S.fn);
    await sleep(300);if(!(await play(res,id,300)))return;
    hot(null);m.busy=false;m.done=true;const ok=pk===q.answer;if(ok)m.first++;
    $$('.cand').forEach((b,i)=>{b.classList.add(i===q.answer?'yes':i===pk?'no':'dim');b.disabled=true;});
    (ok?sfx.pick:sfx.no)();
    bubble(ok?'Σωστά! Διάβασες το πρόγραμμα σαν μηχανικός.':`Σταμάτησα στο ${LET[q.answer]}. Δες τα βήματα ένα ένα.`);
    const pp=$('.mpips');if(pp)pp.innerHTML=pipsHTML();
    const tc=$('#tctl');if(tc)tc.innerHTML=`<button class="btn go" data-act="next" aria-label="Επόμενο">${I.play}</button>`;},
  lsel:d=>{const m=S.m;if(!m||m.done)return;m.sel=+d.i;m.clash=[];m.bad=-1;m.last=-1;sfx.tap();renderMath();},
  lput:d=>{const m=S.m;if(!m||m.game!=='logic'||m.done||m.sel<0)return;const q=m.q,v=+d.v,i=m.sel,n=q.n;m.clash=[];m.bad=-1;m.last=-1;

      if(m.sel<0){m.done=true;if(!m.wrong)m.first++;sfx.pick();renderMath();bubble('Τέλεια! Όλα στη θέση τους.');}else{sfx.tap();renderMath();}
      return;}
    m.wrong++;m.bad=i;const r=Math.floor(i/n),c=i%n;
    q.cur.forEach((x,k)=>{if(x!==v)return;const kr=Math.floor(k/n),kc=k%n;if(kr===r||kc===c||(q.box&&kr-kr%2===r-r%2&&kc-kc%2===c-c%2))m.clash.push(k);});
    sfx.no();renderMath();
    bubble(m.clash.length?(q.box?'Αυτό το χρώμα υπάρχει ήδη εκεί. Κοίτα τη σειρά, τη στήλη και το κουτί.':'Αυτό το χρώμα υπάρχει ήδη εκεί. Κοίτα τη σειρά και τη στήλη.'):'Αν μπει εδώ, δεν θα χωράει κάπου αλλού. Δοκίμασε άλλο χρώμα.');},
