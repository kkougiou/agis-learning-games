name: Verify live DINOBOTS TEST
on:
  push:
    branches: ['deploy/dinobots-test-20261015']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact published bytes
        run: |
          python - <<'PY'
          import urllib.request, hashlib, json, time
          from pathlib import Path
          base='https://kkougiou.github.io/agis-learning-games/'
          checks=[]
          paths=['dinobots-test/'+n for n in ['index.html','manifest.webmanifest','sw.js','three.min.js','icon-192.png','icon-512.png','icon-maskable-512.png']]+['dinobots/index.html','bip/index.html','robomorph/index.html','lexis/index.html']
          for name in paths:
              expected=hashlib.sha256(Path(name).read_bytes()).hexdigest()
              for attempt in range(6):
                  try:
                      req=urllib.request.Request(base+name,headers={'Cache-Control':'no-cache','User-Agent':'DINOBOTS-release-verification'})
                      with urllib.request.urlopen(req,timeout=15) as r:
                          assert r.status==200
                          found=hashlib.sha256(r.read()).hexdigest()
                      assert found==expected, name+' hash mismatch'
                      break
                  except Exception:
                      if attempt==5: raise
                      time.sleep(3)
              checks.append({'path':name,'sha256':found,'status':200})
              print('PASS live',name,flush=True)
          with urllib.request.urlopen(base+'dinobots-test/',timeout=15) as r:
              h=hashlib.sha256(r.read()).hexdigest()
              assert h==hashlib.sha256(Path('dinobots-test/index.html').read_bytes()).hexdigest()
          print('PASS canonical game URL')
          Path('/tmp/dinobots-test-live-receipt.json').write_text(json.dumps({'url':base+'dinobots-test/','public_commit':'67fc15831d140a7d61993b224ed6de502909ce5c','checks':checks},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dinobots-test-live-verification
          path: /tmp/dinobots-test-live-receipt.json
          retention-days: 7
