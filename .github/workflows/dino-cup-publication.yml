name: Verify live DINO CUP
on:
  push:
    branches: ['deploy/dino-cup-20261015']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify seven live release hashes
        run: |
          mkdir -p /tmp/dino-cup-live
          python - <<'PY'
          from pathlib import Path
          import urllib.request,hashlib,json,time
          base='https://kkougiou.github.io/agis-learning-games/dino-cup/'
          results={}
          for f in Path('dino-cup').iterdir():
              expected=hashlib.sha256(f.read_bytes()).hexdigest()
              for attempt in range(12):
                  try:
                      req=urllib.request.Request(base+f.name+'?verify='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
                      raw=urllib.request.urlopen(req,timeout=30).read()
                      assert hashlib.sha256(raw).hexdigest()==expected
                      break
                  except Exception:
                      if attempt==11:raise
                      time.sleep(5)
              results[f.name]=expected
              print('PASS live hash',f.name)
          Path('/tmp/dino-cup-live/hashes.json').write_text(json.dumps(results,indent=2))
          PY
      - name: Browser dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Live game restart and isolated storage
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from playwright.sync_api import sync_playwright
          checks=[]
          def check(name,ok):
              assert ok,name
              checks.append(name);print('PASS',name,flush=True)
          with sync_playwright() as p:
              b=p.chromium.launch(args=['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-dev-shm-usage'])
              c=b.new_context(viewport={'width':800,'height':1280},has_touch=True)
              page=c.new_page();errors=[];page.on('pageerror',lambda e:errors.append(str(e)))
              page.goto('https://kkougiou.github.io/agis-learning-games/dino-cup/')
              page.wait_for_function('window.DinoCup && DinoCup.ready && DinoCup.renderer.info.render.calls>0')
              check('live independent game identity',page.title()=='DINO CUP — Arcade Football' and page.evaluate('DinoCup.saveKey==="agis.dinocup.v1"'))
              page.evaluate('''async()=>{localStorage.setItem('agis.dinobots.save','PRESERVE');localStorage.setItem('bip-save-v1','PRESERVE');await caches.open('dinobots-pwa-preserve');}''')
              page.locator('#play').tap();page.wait_for_function('DinoCup.state.phase==="play"')
              check('live ten players',page.evaluate('DinoCup.state.players.length===10'))
              page.keyboard.down('ArrowUp');page.wait_for_timeout(550);page.keyboard.up('ArrowUp')
              check('live movement',page.evaluate('DinoCup.state.players[0].x>-1.5'))
              page.screenshot(path='/tmp/dino-cup-live/tablet.png')
              page.locator('#pause').tap();t=page.evaluate('DinoCup.state.elapsed');page.wait_for_timeout(300)
              check('live paused clock',page.evaluate('DinoCup.state.elapsed')==t)
              page.reload();page.wait_for_function('DinoCup.ready')
              check('live interrupted match resume',page.locator('#continue').is_visible())
              page.locator('#continue').tap();page.wait_for_timeout(100)
              # Deterministic end-of-half fixture; production transitions and UI remain real.
              page.evaluate('DinoCup.state.phase="play";DinoCup.state.elapsed=DinoCup.state.halfSeconds-.01')
              page.wait_for_function('DinoCup.state.phase==="halftime" && !document.getElementById("dialog").hidden')
              check('halftime UI',page.locator('#dialogTitle').inner_text()=='ΗΜΙΧΡΟΝΟ')
              page.locator('#resume').tap();page.wait_for_function('DinoCup.state.half===2 && DinoCup.state.phase==="play"')
              page.evaluate('DinoCup.state.elapsed=DinoCup.state.halfSeconds-.01')
              page.wait_for_function('DinoCup.state.phase==="ended" && !document.getElementById("rematch").hidden')
              check('full-time UI and rematch',page.locator('#rematch').is_visible())
              page.locator('#rematch').tap();page.wait_for_function('DinoCup.state.phase==="play" && DinoCup.state.half===1')
              check('fresh rematch score',page.evaluate('DinoCup.state.score[0]===0 && DinoCup.state.score[1]===0'))
              page.locator('#pause').tap()
              page.wait_for_function('navigator.serviceWorker.controller!==null')
              check('scoped live service worker',page.evaluate('navigator.serviceWorker.controller.scriptURL==="https://kkougiou.github.io/agis-learning-games/dino-cup/sw.js"'))
              c.set_offline(True);page.reload();page.wait_for_function('DinoCup.ready')
              check('live offline boot retains match',page.locator('#continue').is_visible())
              check('other games data preserved',page.evaluate('localStorage.getItem("agis.dinobots.save")==="PRESERVE" && localStorage.getItem("bip-save-v1")==="PRESERVE"'))
              check('other games cache preserved',page.evaluate('caches.has("dinobots-pwa-preserve")'))
              check('no uncaught live errors',not errors)
              b.close()
          Path('/tmp/dino-cup-live/checks.json').write_text(json.dumps({'passed':len(checks),'checks':checks},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dino-cup-live-verification
          path: /tmp/dino-cup-live/
          retention-days: 14
