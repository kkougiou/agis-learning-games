name: Verify live DINO CUP 0.2.0
on:
  push:
    branches: ['deploy/dino-cup-v02-fairplay-20261015']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait for exact public release bytes
        run: |
          mkdir -p /tmp/cup-live
          python - <<'PY'
          from pathlib import Path
          import urllib.request,time,hashlib,json
          base='https://kkougiou.github.io/agis-learning-games/dino-cup/'
          hashes={}
          for f in sorted(Path('dino-cup').iterdir()):
              expected=hashlib.sha256(f.read_bytes()).hexdigest()
              for attempt in range(90):
                  try:
                      q=urllib.request.Request(base+f.name+'?verify='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
                      raw=urllib.request.urlopen(q,timeout=20).read()
                      assert hashlib.sha256(raw).hexdigest()==expected
                      break
                  except Exception:
                      if attempt==89:raise
                      time.sleep(3)
              hashes[f.name]=expected;print('PASS live hash',f.name,flush=True)
          assert len(hashes)==7
          Path('/tmp/cup-live/hashes.json').write_text(json.dumps(hashes,indent=2))
          PY
      - name: Browser dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify live play and saved progress
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path('/tmp/cup-live');checks=[]
          def check(name,ok):
              checks.append({'name':name,'passed':bool(ok)});(out/'checks.json').write_text(json.dumps(checks,indent=2))
              print(('PASS ' if ok else 'FAIL ')+name,flush=True);assert ok,name
          with sync_playwright() as pw:
              b=pw.chromium.launch(args=['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-dev-shm-usage'])
              c=b.new_context(viewport={'width':800,'height':1280},has_touch=True)
              page=c.new_page();errors=[];page.on('pageerror',lambda e:errors.append(str(e)))
              page.goto('https://kkougiou.github.io/agis-learning-games/dino-cup/?v=0.2.0')
              page.wait_for_function('window.DinoCup&&DinoCup.ready')
              check('live version 0.2.0',page.evaluate('DinoCupEngine.VERSION')=='0.2.0')
              check('save key unchanged',page.evaluate('DinoCup.saveKey')=='agis.dinocup.v1')
              page.evaluate('''async()=>{localStorage.setItem('agis.dinobots.save','PRESERVE_DINO');localStorage.setItem('bip-save-v1','PRESERVE_BIP');await caches.open('dinobots-pwa-preserve');}''')
              page.locator('#play').tap();page.wait_for_function('DinoCup.state.phase==="play"')
              check('ten live players',page.evaluate('DinoCup.state.players.length')==10)
              check('stadium audio context starts from gesture',page.evaluate('DinoCup.audio.status')=='running')
              # Close finishing fixture; actual charged keyboard action, engine and goal crossing.
              page.evaluate('''()=>{const s=DinoCup.state;s.players.forEach(p=>{p.x=(p.id-5)*3;p.z=16;p.cool=0;p.think=9;p.vx=p.vz=0;});Object.assign(s.players[0],{x:22,z:0,fx:1,fz:0});Object.assign(s.players[9],{x:27.3,z:0});Object.assign(s.ball,{owner:0,last:0,x:23.02,z:0,y:.32,lock:1,kind:'carry'});s.control=0;}''')
              page.keyboard.down('KeyX');page.wait_for_function('DinoCup.input.charging');page.wait_for_timeout(650);page.keyboard.up('KeyX')
              page.wait_for_function('DinoCup.state.score[0]>0',timeout=8000)
              check('human charged shot scores a real live goal',page.evaluate('DinoCup.state.stats[0].shots')>=1)
              check('goal panel remains readable',page.locator('#banner').evaluate('(e)=>Number(getComputedStyle(e).opacity)')>=.99)
              page.screenshot(path=str(out/'goal.png'))
              # Keeper must stop a dribbled ball, not only a free shot.
              page.evaluate('''()=>{const s=DinoCup.state;s.phase='play';s.phaseTime=0;s.paused=false;s.players.forEach(p=>{p.x=(p.id-5)*3;p.z=15;p.cool=0;p.vx=p.vz=0;});Object.assign(s.players[4],{x:-27.3,z:0});Object.assign(s.players[5],{x:-25.5,z:0,fx:-1,fz:0});Object.assign(s.ball,{owner:5,last:5,lock:0,x:-26.52,z:0,y:.32,kind:'carry'});s.control=1;}''')
              page.wait_for_function('DinoCup.state.stats[0].saves>0',timeout=5000)
              check('live keeper smothers a carried ball',True)
              page.locator('#pause').tap();t=page.evaluate('DinoCup.state.elapsed');page.wait_for_timeout(250)
              check('pause freezes time',page.evaluate('DinoCup.state.elapsed')==t)
              # Old v1 shape: remove all new transient fields before the actual reload/import path.
              expected=page.evaluate('''()=>{const d=JSON.parse(localStorage.getItem('agis.dinocup.v1'));const m=JSON.parse(d.match);for(const p of m.players)for(const k of ['dive','diveZ','tackleWind','tackleTarget','lungeX','lungeZ'])delete p[k];delete m.ball.kind;delete m.ball.flight;d.match=JSON.stringify(m);delete d.effects;localStorage.setItem('agis.dinocup.v1',JSON.stringify(d));return m.score;}''')
              page.reload();page.wait_for_function('DinoCup.ready')
              check('old-shape match offers resume',page.locator('#continue').is_visible())
              page.locator('#sound').tap();page.locator('#continue').tap()
              check('old score survives upgrade',page.evaluate('DinoCup.state.score')==expected)
              check('mute disables commentary and effects audio',page.evaluate('DinoCup.audio.enabled') is False)
              page.locator('#pause').tap();page.wait_for_function('navigator.serviceWorker.controller!==null')
              check('worker scoped to DINO CUP',page.evaluate('navigator.serviceWorker.controller.scriptURL').endswith('/dino-cup/sw.js'))
              c.set_offline(True);page.reload();page.wait_for_function('DinoCup.ready')
              check('offline restart preserves match',page.locator('#continue').is_visible())
              check('neighbor saves unaffected',page.evaluate('localStorage.getItem("agis.dinobots.save")==="PRESERVE_DINO"&&localStorage.getItem("bip-save-v1")==="PRESERVE_BIP"'))
              check('neighbor cache unaffected',page.evaluate('caches.has("dinobots-pwa-preserve")'))
              check('no uncaught live game exceptions',not errors)
              b.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dino-cup-v02-live-evidence
          path: /tmp/cup-live/
          retention-days: 14
